   ============================================================ */
function getLeagueClubs(leagueName, playerClubName, playerClubStrength){
  const lg = LEAGUES.find(l=>l.name===leagueName);
  let clubs = [];
  if(lg){
    clubs = lg.clubs.map(([name,strength])=>({name,strength}));
  } else {
    // tier 1-2 amatorskie — generuj unikalne nazwy
    const used = new Set();
    for(let i=0;i<14;i++){
      let name;
      do{ name = genAmateurClubName(); } while(used.has(name));
      used.add(name);
      clubs.push({name,strength:clamp(38+ri(-4,4),30,50)});
    }
  }
  // upewnij się że klub gracza jest w lidze
  if(playerClubName && !clubs.find(c=>c.name===playerClubName)){
    clubs.push({name:playerClubName,strength:playerClubStrength});
  }
  return clubs;
}

function generateFixtures(clubs){
  // round-robin double (home & away)
  const teams = clubs.map((c,i)=>i);
  const n = teams.length;
  const rounds = [];
  const arr = teams.slice();
  if(n%2) arr.push(-1); // bye
  const nn = arr.length;
  for(let r=0;r<nn-1;r++){
    const md=[];
    for(let i=0;i<nn/2;i++){
      const a=arr[i], b=arr[nn-1-i];
      if(a!==-1&&b!==-1) md.push(r%2===0?[a,b]:[b,a]);
    }
    rounds.push(md);
    // rotate
    arr.splice(1,0,arr.pop());
  }
  // druga połowa — odwrócone
  const total=[...rounds];
  rounds.forEach(md=>{
    total.push(md.map(m=>[m[1],m[0]]));
  });
  return total;
}

function initLeagueTable(clubs){
  return clubs.map((c,i)=>({
    name:c.name, strength:c.strength, idx:i,
    played:0, won:0, drawn:0, lost:0, gf:0, ga:0, gd:0, pts:0,
  }));
}

function simulateClubMatch(home, away){
  // lekka symulacja — bez metryk gracza, tylko wynik
  const hs = home.strength + ri(-5,5) + 3; // home advantage
  const as = away.strength + ri(-5,5);
  const diff = hs - as;
  let hg = clamp(Math.round(diff/12 + 1.4 + Math.random()*0.7), 0, 6);
  let ag = clamp(Math.round(-diff/12 + 1.1 + Math.random()*0.7), 0, 6);
  return {hg, ag};
}

function applyResultToTable(table, homeName, awayName, hg, ag){
  const h = table.find(t=>t.name===homeName);
  const a = table.find(t=>t.name===awayName);
  if(!h||!a) return;
  h.played++; a.played++;
  h.gf+=hg; h.ga+=ag; a.gf+=ag; a.ga+=hg;
  if(hg>ag){ h.won++; h.pts+=3; a.lost++; }
  else if(hg<ag){ a.won++; a.pts+=3; h.lost++; }
  else { h.drawn++; a.drawn++; h.pts++; a.pts++; }
  h.gd=h.gf-h.ga; a.gd=a.gf-a.ga;
}

function sortTable(table){
  return table.slice().sort((a,b)=>
    b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || b.strength-a.strength
  );
}

function simMatchday(table, fixtures, mdIdx, playerClubName, playerMatch){
  // symuluj wszystkie mecze danej kolejki
  const results=[];
  for(const [hi,ai] of fixtures[mdIdx]){
    const home=table[hi], away=table[ai];
    let hg, ag;
    if(playerMatch && home.name===playerClubName){
      hg=playerMatch.teamGoals; ag=playerMatch.oppGoals;
    } else if(playerMatch && away.name===playerClubName){
      hg=playerMatch.oppGoals; ag=playerMatch.teamGoals;
    } else {
      const r=simulateClubMatch(home,away); hg=r.hg; ag=r.ag;
    }
    applyResultToTable(table, home.name, away.name, hg, ag);
    results.push({md:mdIdx+1, home:home.name, away:away.name, hg, ag});
  }
  return results;
}

/* ============================================================
   SILNIK MECZOWY
   ============================================================ */
function simulateMatch(p){
  const s=S.season;
  const D=DIFFICULTIES[p.difficulty];
  const grp = posGroup(p.position);
  // Pobierz przeciwnika z terminarza jeśli jest
  let oppName = null, oppStrength;
  const playerClubName = S.club ? S.club.name : null;
  if(s.fixtures && s.matchday < s.fixtures.length){
    const md = s.fixtures[s.matchday];
    for(const [hi,ai] of md){
      const home=s.leagueTable[hi], away=s.leagueTable[ai];
      if(home && home.name===playerClubName){ oppName=away.name; oppStrength=away.strength; break; }
      if(away && away.name===playerClubName){ oppName=home.name; oppStrength=home.strength; break; }
    }
  }
  if(oppStrength===undefined) oppStrength = clamp(s.clubStrength + ri(-12,12), 30, 99);
  // rola w składzie
  let role = 'starter';
  if(p.health<60 || (p.form<45 && Math.random()<0.35)) role='bench';
  if(p.age>=33 && Math.random()<0.3) role='bench';
  if(D.bench>1 && Math.random()<0.25*D.bench && p.ovr<oppStrength+3) role='bench';

  const starter = role==='starter';
  const baseMin = starter ? ri(55,90) : ri(0,30);
  const minutes = p.health<50 ? Math.round(baseMin*0.5) : baseMin;

  const formFactor = 0.85 + p.form/500;   // 0.85 - 1.04
  const healthFactor = 0.90 + p.health/600; // 0.90 - 1.07
  const moraleFactor = 0.92 + p.morale/600;  // 0.92 - 1.09
  const repFactor = 0.96 + p.reputation/800; // 0.96 - 1.09
  const chemFactor = 0.95 + (S.team.chemistry/100)*0.10; // 0.95 - 1.05
  const attrFactor = 0.96 + (attrAvg(p.attributes)/100)*0.08; // 0.96 - 1.04
  // perf znormalizowane: OVR/100 × modyfikatory, każdy mnożnik blisko 1.0
  // OVR 50: ~0.45, OVR 70: ~0.65, OVR 90: ~0.85 (z dobrymi modyfikatorami)
  const perf = (p.ovr/100) * formFactor * healthFactor * moraleFactor * repFactor * chemFactor * attrFactor;
  const minFactor = minutes/90;

  // wynik drużyny (potrzebny zawsze, także dla GK)
  // Wynik drużyny zależy głównie od siły klubu, nie gracza
  const teamPerf = s.clubStrength + (perf*minutes/90)*3 + ri(-6,6);
  const oppPerf = oppStrength + ri(-6,6);
  let teamGoals = clamp(Math.round((teamPerf-oppPerf)/15 + 1.35 + Math.random()*0.6), 0, 6);
  let oppGoals = clamp(Math.round((oppPerf-teamPerf)/15 + 1.15 + Math.random()*0.6), 0, 6);
  const result = teamGoals>oppGoals?'W':(teamGoals<oppGoals?'L':'D');

  const res = {opp:oppStrength, oppName, minutes, role, teamGoals, oppGoals, result, pos:{}};

  if(grp==='GK'){
    // BRAMKARZ: pełne metryki w stylu fbref
    const shotsFaced = Math.max(1, oppGoals + ri(2,7));
    const conceded = oppGoals;
    const saves = Math.max(0, shotsFaced - conceded);
    const savePct = shotsFaced? +(saves/shotsFaced*100).toFixed(1) : 100;
    const cleanSheet = conceded===0 && minutes>=60 ? 1 : 0;
    const punches = ri(0,4);
    const highClaims = ri(0,3);
    // PSxG (Post-Shot Expected Goals) — szacunkowa wartość strzałów po ciele
    // PSxGAgainst = suma xG wszystkich strzałów na celę; ~0.10-0.30 na strzał
    const psxgAgainst = +(shotsFaced * (0.08 + Math.random()*0.22) * (oppStrength/80)).toFixed(2);
    const psxgMinusGA = +(psxgAgainst - conceded).toFixed(2);
    // goalsPrevented = PSxG - GA (pozytywne = obronił więcej niż oczekiwano)
    const goalsPrevented = psxgMinusGA;
    // Dośrodkowania
    const crossesFaced = ri(3,12);
    const crossesStopped = Math.floor(crossesFaced * (0.06 + (p.ovr/100)*0.14 + Math.random()*0.05));
    const crossStopPct = crossesFaced? +(crossesStopped/crossesFaced*100).toFixed(1) : 0;
    // Akcje libero (wyjścia poza pole)
    const sweeperActions = ri(0,4);
    // Wyrzuty (goal kicks / rozegranie długie)
    const passAttempts = ri(15,35);
    const launchedPasses = ri(5,18);
    const launchPct = passAttempts? +(launchedPasses/passAttempts*100).toFixed(1) : 0;
    // Nowe metryki GK
    const claims = ri(0,4);
    const distributionAcc = clamp(ri(55,85) + (p.ovr-60)*0.3, 40, 95);
    const goalsPreventedPer90 = minutes>0 ? +((goalsPrevented/minutes)*90).toFixed(2) : 0;
    res.pos = {saves, goalsConceded:conceded, savePct, cleanSheets:cleanSheet, punches, highClaims,
      shotsFaced, psxgAgainst, psxgMinusGA, goalsPrevented,
      crossesFaced, crossesStopped, crossStopPct,
      sweeperActions, launchedPasses, passAttempts, launchPct,
      claims, distributionAcc, goalsPreventedPer90};
    let rating = 5.5 + (perf-0.45)*4.0 + saves*0.12 + cleanSheet*1.0 - conceded*0.35 + goalsPrevented*0.3;
    if(p.health<60) rating-=0.5;
    rating = clamp(rating + (Math.random()*0.8-0.4), 3.0, 10);
    const MOTM = (rating>=8.5 && (cleanSheet||saves>=6) && Math.random()<0.25) || (rating>=9.5);
    const yellow = Math.random()<0.05?1:0;
    const cards = yellow;
    let injured=0;
    if(Math.random()<0.05*D.injury*(minutes/90+0.3)) injured=ri(7,40);
    Object.assign(res,{goals:0,assists:0,xG:0,xA:0,rating:+rating.toFixed(1),cards,injured,MOTM});
  } else {
    // Pozycje z polem — gole/asysty/xG Poissonem, plus metryki specyficzne
    const posGoalsBase = grp==='ST'?0.42:(grp==='WG'?0.28:(grp==='MF'?0.10:0.03));
    const posAssistsBase = grp==='MF'?0.22:(grp==='WG'?0.28:(grp==='ST'?0.15:0.04));
    const xG = clamp(posGoalsBase * perf * minFactor * (0.6+Math.random()*0.8), 0, 1.5);
    const xA = clamp(posAssistsBase * perf * minFactor * (0.6+Math.random()*0.8), 0, 1.2);
    const goals = poisson(xG);
    const assists = poisson(xA*0.8);

    let rating = 5.5 + (perf-0.45)*4.0 + goals*0.8 + assists*0.6 - (minutes<20?0.5:0);
    if(p.health<60) rating-=0.5;
    rating = clamp(rating + (Math.random()*0.8-0.4), 3.0, 10);

    const yellow = Math.random()<0.16?1:0;
    const red = Math.random()<0.02?1:0;
    const cards = yellow + (red?1:0);
    let injured=0;
    if(Math.random()<0.08*D.injury*(minutes/90+0.3)) injured=ri(7,45);
    const MOTM = (rating>=8.5 && goals+assists>=2 && Math.random()<0.25) || (rating>=9.5);

    const pos={};
    if(grp==='DF'){
      const tck=ri(0,6); const aerWon=ri(0,6); const aerTotal=ri(2,8);
      pos.tackles=tck; pos.tacklesWon=Math.floor(tck*(0.6+Math.random()*0.35));
      pos.interceptions=ri(0,5); pos.blocks=ri(0,4);
      pos.aerialWon=aerWon; pos.aerialWinPct=aerTotal?+((aerWon/aerTotal)*100).toFixed(1):0;
      pos.clearances=ri(0,8); pos.crosses=ri(0,3);
      pos.errors=ri(0,2); pos.dribbledPast=ri(0,3);
      pos.progressivePasses=ri(1,8); pos.passAcc=clamp(ri(70,92)+(p.ovr-60)*0.2,60,95); pos.pressures=ri(3,15);
    } else if(grp==='MF'){
      pos.passes=ri(20,80); pos.passAcc=clamp(ri(65,95)+(p.ovr-60)*0.2,55,95); pos.keyPasses=ri(0,4);
      pos.tackles=ri(0,5); pos.duelsWon=ri(0,7); pos.dribbles=ri(0,4);
      pos.progressivePasses=ri(2,12); pos.progressiveCarries=ri(0,6); pos.passesIntoBox=ri(0,5);
      pos.throughBalls=ri(0,3); pos.shotCreatingActions=ri(0,5); pos.recoveries=ri(0,8);
    } else if(grp==='WG'){
      pos.dribbles=ri(0,7); pos.crosses=ri(0,6); pos.keyPasses=ri(0,5);
      pos.goals=goals; pos.assists=assists; pos.shots=ri(0,5); pos.shotsOnTarget=Math.min(ri(0,4),pos.shots);
      pos.touchesBox=ri(3,12); pos.progressiveCarries=ri(1,8); pos.xG=+xG.toFixed(2); pos.xA=+xA.toFixed(2);
      pos.shotCreatingActions=ri(0,6);
    } else if(grp==='ST'){
      const shts=ri(1,6); const sot=Math.min(ri(0,5),shts);
      pos.goals=goals; pos.shots=shts; pos.shotsOnTarget=sot;
      pos.shotAccPct=shts?+((sot/shts)*100).toFixed(1):0;
      pos.xG=+xG.toFixed(2); pos.npxG=+(Math.max(0,xG-Math.random()*0.3)).toFixed(2);
      pos.xGPerShot=shts?+(xG/shts).toFixed(2):0;
      pos.bigChances=ri(0,3); pos.bigChancesMissed=ri(0,pos.bigChances);
      pos.goalConversionPct=shts?+((goals/shts)*100).toFixed(1):0;
      pos.touchesBox=ri(3,15); pos.aerialWon=ri(0,5);
      pos.offside=ri(0,3); pos.presses=ri(2,12);
    }
    res.pos=pos;
    Object.assign(res,{goals,assists,xG:+xG.toFixed(2),xA:+xA.toFixed(2),rating:+rating.toFixed(1),cards,injured,MOTM});
  }
  return res;
}

function poisson(lambda){
  const L=Math.exp(-lambda); let k=0,p=1;
  do{ k++; p*=Math.random(); } while(p>L);
  return k-1;
}

/* ============================================================
   PUCHARY KLUBOWE — puchar krajowy, Liga Mistrzów, Liga Europy
   ============================================================ */
function simulateKnockoutCompetition(cup, playerClub, playerPerf){
  // Generuj uczestników na podstawie typu pucharu
  let participants = [];
  if(cup.type==='domestic_cup'){
    // kluby z tej samej ligi co gracz
    if(S.season.leagueTable){
      participants = S.season.leagueTable.map(t=>({name:t.name,strength:t.strength}));
    } else {
      participants = [{name:playerClub.name,strength:playerClub.strength}];
      for(let i=0;i<15;i++) participants.push({name:genAmateurClubName(),strength:clamp(40+ri(-5,15),35,80)});
    }
  } else if(cup.type==='ucl'){
    // top kluby z lig tier 4-5
    for(let i=0;i<32;i++) participants.push({name:genAmateurClubName(),strength:clamp(78+ri(-8,12),72,96)});
    // dodaj realne top kluby
    const topLeagues = LEAGUES.filter(l=>l.tier>=4);
    topLeagues.forEach(lg=>{
      lg.clubs.slice(0,4).forEach(([name,str])=>{
        if(name!==playerClub.name) participants.push({name,strength:str});
      });
    });
    participants = participants.slice(0,32);
  } else if(cup.type==='uel'){
    for(let i=0;i<32;i++) participants.push({name:genAmateurClubName(),strength:clamp(70+ri(-8,12),62,88)});
    const midLeagues = LEAGUES.filter(l=>l.tier>=3);
    midLeagues.forEach(lg=>{
      lg.clubs.slice(0,3).forEach(([name,str])=>{
        if(name!==playerClub.name) participants.push({name,strength:str});
      });
    });
    participants = participants.slice(0,32);
  }
  // upewnij się że klub gracza jest
  if(!participants.find(p=>p.name===playerClub.name)){
    participants.push({name:playerClub.name,strength:playerClub.strength});
  }

  // fazy pucharowe
  const stages = ['1/16 finału','1/8 finału','Ćwierćfinał','Półfinał','Finał'];
  let stageIdx = 0;
  const results = [];
  const advance = (playerPerf-0.50)*3 + 0.35;

  for(let i=0;i<stages.length;i++){
    const opp = pick(participants.filter(p=>p.name!==playerClub.name));
    if(!opp) break;
    // gracz gra vs opp
    const playerStrength = playerClub.strength + ri(-8,8) + (playerPerf-0.5)*15;
    const oppStrength = opp.strength + ri(-8,8);
    const diff = playerStrength - oppStrength;
    let pg = clamp(Math.round(diff/10 + 1.3 + Math.random()*0.8), 0, 5);
    let og = clamp(Math.round(-diff/10 + 1.1 + Math.random()*0.8), 0, 5);
    // dogrywka/karne jeśli remis
    let pens = null;
    if(pg===og){
      if(Math.random() < 0.5 + advance*0.15){ pg++; } else { og++; }
      pens = true;
    }
    const won = pg>og;
    results.push({stage:stages[i], opp:opp.name, pg, og, won, pens});
    if(!won) { cup.eliminated=true; stageIdx=i; break; }
    stageIdx=i+1;
  }
  cup.stage = stageIdx<stages.length ? stages[stageIdx] : 'Zwycięzca';
  cup.results = results;
  if(cup.stage==='Zwycięzca'){
    S.career.trophies.push({name:cup.name, season:S.career.season+1});
    S.player.reputation=clamp(S.player.reputation+10,0,100);
    S.flags.achievements.add('cup_winner_'+cup.type);
  } else if(cup.stage==='Finał'){
    S.player.reputation=clamp(S.player.reputation+5,0,100);
  }
  return cup;
}

/* ============================================================
   SYMULACJA SEZONU
   ============================================================ */
function startSeason(){
  S.season = newSeasonState();
  // Reset akcji rewolucyjnych na sezon
  if(S.auxSet) S.auxSet.lastChangedSeason=null;
  if(!S.club){
    assignStarterClub();
  }
  // Liga jest przypisana do klubu
  let leagueName = S.club.league || '';
  let leagueWage = null;
  if(S.club.league){
    const fullLeague = LEAGUES.find(l=>l.name===S.club.league);
    if(fullLeague){ leagueName = fullLeague.name; leagueWage = fullLeague.wage; }
  }
  if(!leagueName){
    const lg=currentLeague()||leagueMetaForTier(S.leagueTier);
    leagueName = lg.name;
  }
  S.season.league=leagueName;
  S.season.club=S.club.name;
  S.season.clubStrength=S.club.strength;
  S.season.wage=Math.round(S.player.weeklyWage*52);
  if(!S.contract){
    S.contract=generateContract(S.player.ovr, S.leagueTier, S.player.weeklyWage);
  }
  // INICJUJ TABELĘ LIGOWĄ
  const clubs = getLeagueClubs(leagueName, S.club.name, S.club.strength);
  S.season.leagueTable = initLeagueTable(clubs);
  S.season.fixtures = generateFixtures(clubs);
  S.season.matchday = 0;
  S.season.totalMatchdays = S.season.fixtures.length;
  S.season.leagueResults = [];
  // PUCHARY KLUBOWE
  S.season.cups = [];
  const tier = S.leagueTier;
  // Puchar krajowy — zawsze
  S.season.cups.push({name:'Puchar Kraju', type:'domestic_cup', stage:null, results:[], eliminated:false});
  // Puchary europejskie — na podstawie kwalifikacji z poprzedniego sezonu
  var playerLeague = leagueByName(S.club.league || leagueMetaForTier(tier).name);
  if(playerLeague && isEuropeanLeague(playerLeague) && isTopDivision(playerLeague)){
    if(clubInEuropeanComp(S.club.name, 'ucl')){
      S.season.cups.push({name:'Liga Mistrzów', type:'ucl', stage:null, results:[], eliminated:false});
    } else if(clubInEuropeanComp(S.club.name, 'uel')){
      S.season.cups.push({name:'Liga Europy', type:'uel', stage:null, results:[], eliminated:false});
    } else if(clubInEuropeanComp(S.club.name, 'uecl')){
      S.season.cups.push({name:'Liga Konferencji', type:'uecl', stage:null, results:[], eliminated:false});
    }
  } else if(tier>=5 || S.club.strength>=80){
    // Fallback: stara logika gdy brak kwalifikacji
    S.season.cups.push({name:'Liga Mistrzów', type:'ucl', stage:null, results:[], eliminated:false});
  } else if(tier>=4 || S.club.strength>=70){
    S.season.cups.push({name:'Liga Europy', type:'uel', stage:null, results:[], eliminated:false});
  }
  // CELE SEZONU
  S.goals = S.goals || {current:[],history:[]};
  S.goals.current = generateSeasonGoals();
  // DECYZJE — generuj na start sezonu
  S.decisions = S.decisions || {pending:[],history:[]};
  S.decisions.pending = rollDecisions();
  // TRENING — resetuj na nowy sezon
  S.training = S.training || {selectedPlan:null,history:[],boosts:{}};
  S.training.selectedPlan = null;
  // KONFERENCJA PRASOWA — ustaw jako oczekującą po sezonie
  if(!S.pressConference) S.pressConference = {done:false, pending:false};
  S.pressConference.done = false;
  S.pressConference.pending = true;
  // AKCJE ŻYCIOWE — reset na nowy sezon
  if(S.life){
    S.life.actionsUsed = {};
    S.life.dedication = null;
  }
}

function assignStarterClub(){
  const t=S.player.ovr;
  let tier = t>=70?3:(t>=58?2:1);
  if(S.player.difficulty==='trudny') tier=Math.max(1,tier-1);
  if(S.player.difficulty==='latwy') tier=Math.min(3,tier+1);
  S.leagueTier=tier;
  S.club=makeClub(tier);
  const lg=leagueMetaForTier(tier);
  // lg.wage to pensja tygodniowa (min-max), wybieramy z zakresu
  S.player.weeklyWage = ri(lg.wage[0],lg.wage[1]);
  S.contract = generateContract(S.player.ovr, tier, S.player.weeklyWage);
}

function totalMatchesForSeason(){
  // Liczba meczów = liczba kolejek (round-robin double)
  if(S.season && S.season.fixtures) return S.season.fixtures.length;
  const lg=currentLeague()||leagueMetaForTier(S.leagueTier);
  const numMatches = Math.max(10, lg.clubs-1) + (S.leagueTier>=4?6:0);
  return Math.max(30, numMatches*2);
}

function simQuickSeason(){
  const p=S.player;
  const totalMatches = totalMatchesForSeason();
  while(S.season.played<totalMatches){
    const m=simulateMatch(p);
    applyMatch(m);
  }
  finalizeSeason();
}

function applyMatch(m){
  const s=S.season, p=S.player, grp=posGroup(p.position);
  s.played++;

  // PLAYSTYLE + REWOLUCYJNE BOOSTY
  applyPlaystylesToMatch(m);
  applyTacticalRoleBoosts(m);
  applyWeakFootBoost(m);
  applyBigGameBoost(m);
  applySignatureMoveBoost(m);
  applyCoachTrustBoost(m);
  applyCaptainBoost(m);

  // AKTUALIZUJ TABELĘ LIGOWĄ — mecz gracza + reszta kolejki
  if(s.leagueTable && s.fixtures && s.matchday < s.fixtures.length){
    const playerClubName = S.club.name;
    const mdResults = simMatchday(s.leagueTable, s.fixtures, s.matchday, playerClubName, m);
    s.leagueResults = s.leagueResults.concat(mdResults);
    s.matchday++;
  }
  s.goals+=(m.goals||0); s.assists+=(m.assists||0);
  s.minutes+=m.minutes; s.xG+=(m.xG||0); s.xA+=(m.xA||0);
  s.ratings.push(m.rating); s.cards+=m.cards;
  if(m.MOTM) s.MOTM++;

  // STATYSTYKI KLUBOWE
  if(!s.clubStats) s.clubStats={
    goalsFor:0, goalsAgainst:0, shots:0, shotsOnTarget:0, xG:0, xGA:0,
    wins:0, draws:0, losses:0, cleanSheets:0,
    playerGoals:0, playerAssists:0, playerXG:0, playerShots:0, playerKeyPasses:0, playerMOTM:0
  };
  const cs=s.clubStats;
  cs.goalsFor+=m.teamGoals||0; cs.goalsAgainst+=m.oppGoals||0;
  cs.shots+=ri(8,20); cs.shotsOnTarget+=ri(3,10); cs.xG+=+(m.xG||0+ri(0.5,2.5)).toFixed(2);
  cs.xGA+=+((m.oppGoals||0)*0.8+Math.random()*1.5).toFixed(2);
  if(m.result==='W') cs.wins++; else if(m.result==='D') cs.draws++; else cs.losses++;
  if((m.oppGoals||0)===0) cs.cleanSheets++;
  cs.playerGoals+=(m.goals||0); cs.playerAssists+=(m.assists||0);
  cs.playerXG+=(m.xG||0); cs.playerShots+=(m.pos?.shots||0);
  cs.playerKeyPasses+=(m.pos?.keyPasses||0); if(m.MOTM) cs.playerMOTM++;

  // ZAAWANSOWANE METRYKI
  if(!s.advanced) s.advanced = emptyAdvancedTotals();
  var advMetrics = generateAdvancedMetrics(m, grp);
  aggregateAdvanced(s.advanced, advMetrics);
  s.advanced.matches = (s.advanced.matches||0) + 1;

  // agreguj metryki pozycyjne
  const pctKeys=new Set(['savePct','passAcc','crossStopPct','launchPct','distributionAcc','aerialWinPct','shotAccPct','goalConversionPct','xGPerShot','goalsPreventedPer90']);
  for(const k in m.pos){
    if(typeof m.pos[k]==='number'){
      if(pctKeys.has(k)){
        s.pos[k] = +(((s.pos[k]||0)*(s.played-1) + m.pos[k])/s.played).toFixed(2);
      } else {
        s.pos[k]=(s.pos[k]||0)+m.pos[k];
      }
    }
  }

  // STATYSTYKI MIESIĘCZNE (forma miesiąc po miesiącu)
  if(!s.monthlyForm) s.monthlyForm=[];
  const monthIdx=Math.min(Math.floor((s.played-1)/Math.max(1,Math.ceil(s.totalMatchdays/8))),7);
  if(!s.monthlyForm[monthIdx]) s.monthlyForm[monthIdx]={matches:0,rating:0,goals:0,assists:0,form:0};
  const mf=s.monthlyForm[monthIdx];
  mf.matches++; mf.rating=+((mf.rating*(mf.matches-1)+m.rating)/mf.matches).toFixed(2);
  mf.goals+=(m.goals||0); mf.assists+=(m.assists||0);

  // streaki
  if(m.result==='W'){ s.streak = s.streakType==='W'? s.streak+1:1; s.streakType='W'; }
  else if(m.result==='L'){ s.streak = s.streakType==='L'? s.streak+1:1; s.streakType='L'; }
  else { s.streak=0; s.streakType='D'; }

  p.form = clamp(p.form + (m.rating-6.5)*3 + (m.goals||0)*2 + (m.assists||0)*1.5 + (s.streak>=3&&s.streakType==='W'?1:0), 30, 99);
  p.morale = clamp(p.morale + (m.rating-6)*2 + (m.result==='W'?3:m.result==='L'?-3:0), 20, 99);

  if(m.injured>0){ p.health=clamp(p.health-15,0,100); s.injured+=m.injured; }
  else p.health=clamp(p.health+1,0,100);

  if(m.rating>=8.5) p.reputation=clamp(p.reputation+0.3,0,100);

  s.matches.push(m);
  S.stats.matches++; S.stats.goals+=(m.goals||0); S.stats.assists+=(m.assists||0);
  S.stats.minutes+=m.minutes; S.stats.xG+=(m.xG||0); S.stats.xA+=(m.xA||0);
  S.stats.ratings.push(m.rating); S.stats.cards+=m.cards;
  if(m.MOTM) S.stats.MOTM++;
  if(grp==='GK'){
    S.stats.cleanSheets=(S.stats.cleanSheets||0)+(m.pos.cleanSheets||0);
    S.stats.saves=(S.stats.saves||0)+(m.pos.saves||0);
  }
  if(grp==='DF'||grp==='MF'){
    S.stats.tackles=(S.stats.tackles||0)+(m.pos.tackles||0);
  }
  if(m.injured>0){
    p.health=clamp(p.health-5,0,100);
  }
}

function simOneMatch(){
  const p=S.player;
  const m=simulateMatch(p);
  applyMatch(m);
  S.season.matchLogIdx=(S.season.matchLogIdx||0)+1;
  return m;
}

function finalizeSeason(){
  const s=S.season, p=S.player, D=DIFFICULTIES[p.difficulty], grp=posGroup(p.position);
  const avgRating = s.ratings.length? s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length : 6;
  const minutesPct = s.played? (s.minutes/(s.played*90))*100 : 0;

  const gkBonus = grp==='GK' ? (s.pos.cleanSheets||0)*0.4 + (s.pos.savePct||0)/40 : 0;
  const perfScore = (s.goals||0)*0.5 + avgRating + (s.MOTM*0.5) - s.cards*0.1 + gkBonus;
  // POZYCJA W LIDZE — z prawdziwej tabeli
  if(s.leagueTable){
    const sorted = sortTable(s.leagueTable);
    const idx = sorted.findIndex(t=>t.name===S.club.name);
    s.tablePos = idx>=0 ? idx+1 : 16;
  } else {
    s.tablePos = clamp(Math.round(16 - perfScore/1.5 + ri(-2,2)),1,16);
  }

  // ROZWÓJ OVR
  const ageFactor = p.age<21?1.0:(p.age<=24?0.8:(p.age<=27?0.5:(p.age<=30?0.25:-0.4)));
  const minFactor = clamp(minutesPct/70,0.2,1.0);
  const formFactor = 0.8 + (avgRating-6)/6;
  let growth = (0.8 + ri(0,1.5)) * D.mult * ageFactor * minFactor * formFactor;
  growth = Math.max(D.growthFloor, growth);
  // HARD CAP: max +6 na sezon (latwy), +4 (normalny), +2 (trudny)
  const maxGrowth = D.mult >= 1.3 ? 6 : (D.mult >= 0.9 ? 4 : 2);
  growth = Math.min(growth, maxGrowth);

  if(avgRating>=7.2 && minutesPct>=60 && p.age<=28){
    p.potential = clamp(p.potential + ri(1,3), p.ovr, 99);
  }
  if(s.injured>0) p.potential = clamp(p.potential - ri(0,2), p.ovr+1, 99);
  if(minutesPct<30 && p.age<=26) p.potential = clamp(p.potential - ri(0,2), p.ovr+1, 99);

  const headroom = Math.max(0, p.potential - p.ovr);
  growth = Math.min(growth, headroom + 0.5);
  p.ovr = clamp(p.ovr + growth, 30, 99);
  p.ovr = +p.ovr.toFixed(1);

  // rozwój atrybutów
  if(!p.attributes || !Object.keys(p.attributes).length) p.attributes=generateAttributes(p.ovr,p.position);
  driftAttributes(p.attributes, growth, p.position);

  p.health = clamp(p.health + 25, 0, 100);
  p.form = clamp(60 + ri(-5,10), 30, 95);
  p.age++;

  // PUCHARY KLUBOWE
  const playerPerf = (p.ovr/100) * (0.85 + p.form/500) * (0.90 + p.health/600);
  if(s.cups && s.cups.length){
    s.cups.forEach(cup=>{
      if(!cup.eliminated && cup.stage===null){
        simulateKnockoutCompetition(cup, S.club, playerPerf);
        S.career.competitions.push({
          name:cup.name, season:S.career.season+1, stage:cup.stage, type:cup.type
        });
      }
    });
  }

  // WYDARZENIA LOSOWE (1-3 na sezon)
  const events = rollRandomEvents();
  const appliedEvents=[];
  events.forEach(ev=>{
    const applied = applyEventEffects(ev);
    appliedEvents.push({...ev, applied});
  });
  s.events = appliedEvents;

  // WYDARZENIA ŻYCIOWE — choroba, śmierć, kryzys, wsparcie
  processLifeEventRecovery();
  var lifeEvent = rollLifeEvent();
  if(lifeEvent){
    appliedEvents.push({title: lifeEvent.title, type: lifeEvent.type.indexOf('death')>=0?'negative':(lifeEvent.type.indexOf('illness')>=0?'negative':(lifeEvent.type.indexOf('crisis')>=0?'negative':'positive'))});
    s.lifeEvent = lifeEvent;
    if(lifeEvent.effects.missedDays){
      s.injured = (s.injured||0) + lifeEvent.effects.missedDays;
    }
  } else {
    s.lifeEvent = null;
  }

  // PENSJA i przychody
  const lg=currentLeague()||leagueMetaForTier(S.leagueTier);
  const wageYear = s.wage || (p.weeklyWage*52);
  let income = wageYear;
  let investPct=0;
  for(const id in S.spendOwned){
    const it=SPEND_OPTIONS.find(o=>o.id==id);
    if(it && it.effects.income) investPct += it.effects.income;
  }
  // NERF: cap investment income
  investPct = Math.min(investPct, SHOP_INCOME_CAP);
  income += (p.wealth * investPct/100);

  // MARKA OSOBISTA — dochód sponsoringowy
  const goalsInvolved = (s.goals||0)+(s.assists||0)+(grp==='GK'?(s.pos.cleanSheets||0):0);
  const sponsorIncome = updateBrand(avgRating, goalsInvolved);
  income += sponsorIncome;

  p.wealth += income;

  // CHEMIA ZESPOŁU
  updateChemistry({tablePos:s.tablePos, avgRating});

  // KONTRAKT
  tickContract();

  const rec = {
    season: ++S.career.season, age:p.age-1, club:s.club, league:s.league||lg.name,
    ovr:+p.ovr.toFixed(1), potential:p.potential,
    matches:s.played, goals:s.goals, assists:s.assists, minutes:s.minutes,
    xG:+s.xG.toFixed(1), xA:+s.xA.toFixed(1), avgRating:+avgRating.toFixed(2),
    cards:s.cards, MOTM:s.MOTM, tablePos:s.tablePos, injuredDays:s.injured,
    wageYear, income:+income.toFixed(0), wealth:+p.wealth.toFixed(0),
    position:p.position, posGroup:grp, pos:{...s.pos},
    events: appliedEvents.map(e=>({title:e.title,type:e.type})),
    chemistry:S.team.chemistry, followers:S.brand.followers,
    advanced: s.advanced ? JSON.parse(JSON.stringify(s.advanced)) : null,
    euroCupRun: s.euroCupRun || null,
  };
  S.career.history.push(rec);

  // CELE SEZONU
  const goalResults = evaluateGoals(s);
  s.goalResults = goalResults;

  // REKORDY KARIERY
  const recordBanners = checkSeasonRecords(rec);
  s.recordBanners = recordBanners;

  // NAGRODY INDYWIDUALNE
  const awards = evaluateAwards(rec);
  s.awards = awards;

  // SYMULACJA ŚLEDZONYCH ROZGRYWEK
  simAllTrackedLeagues();

  // TABELE WSZYSTKICH LIG + Kwalifikacje do pucharów europejskich
  ensureWorldLeagueTables(S.career.season);
  ensureUefaCoefficients();
  computeEuropeanQualifiers(S.career.season);

  // SYMULACJA PUCHARÓW EUROPEJSKICH dla klubu gracza
  if(S.club && isEuropeanLeague(leagueByName(S.club.league))){
    var compType = clubInEuropeanComp(S.club.name, 'ucl') ? 'ucl' : (clubInEuropeanComp(S.club.name, 'uel') ? 'uel' : (clubInEuropeanComp(S.club.name, 'uecl') ? 'uecl' : null));
    if(compType){
      var euroRun = simulateEuroCupRun(S.club.name, S.club.strength, compType);
      euroRun.comp = compType;
      s.euroCupRun = euroRun;
      if(euroRun.stage.indexOf('Zwycięzca')>=0){
        S.career.trophies.push({name:euroRun.stage, season:S.career.season});
        p.reputation = clamp(p.reputation + 8, 0, 100);
      }
    }
  }

  // SYMULACJA WSZYSTKICH PUCHARÓW EUROPEJSKICH + aktualizacja współczynników UEFA
  simulateAllEuroCups(S.career.season);

  // RYWAL KARIERY
  simulateRivalSeason();

  // ZAPISZ PODSUMOWANIE ŚWIATA
  if(S.world){
    S.world.seasonSummaries.push({
      season:S.career.season,
      playerLeague:s.league,
      playerTablePos:s.tablePos,
      tracked:Object.keys(S.world.leagues||{}).map(ln=>({
        league:ln, champion:S.world.leagues[ln]?.champion
      }))
    });
    if(S.world.seasonSummaries.length>20) S.world.seasonSummaries=S.world.seasonSummaries.slice(-20);
  }

  handleNationalTeam(avgRating);

  if(s.tablePos<=2){
    const trophy = S.leagueTier>=4? 'Mistrzostwo '+ (s.league||lg.name) : 'Awans/Zwycięstwo '+ (s.league||lg.name);
    S.career.trophies.push({name:trophy, season:S.career.season});
  }

  // SYSTEM AWANSÓW I SPADKÓW — zachowaj ten sam klub, zmień ligę
  s.leagueMovement = null;
  var curLg = leagueByName(s.league || (S.club ? S.club.league : null));
  if(!curLg && S.club) curLg = LEAGUES.find(l=>l.name===S.club.league);
  if(curLg){
    var clubsInLg = curLg.clubs.length || 16;
    var promoteSlots = 2;
    var relegateSlots = curLg.tier >= 4 ? 3 : 2;
    // AWANS — ten sam klub awansuje do wyższej ligi
    if(curLg.promotesTo && s.tablePos <= promoteSlots){
      var higherLg = leagueByName(curLg.promotesTo);
      if(higherLg){
        var promotedClub = {name:S.club.name, strength:S.club.strength, league:higherLg.name, country:higherLg.country, flag:higherLg.flag, tier:higherLg.tier};
        s.leagueMovement = {type:'promoted', from:curLg.name, to:higherLg.name, newClub:promotedClub};
        S.club = promotedClub;
        S.leagueTier = higherLg.tier;
        s.league = higherLg.name;
        s.club = promotedClub.name;
        p.weeklyWage = Math.round(ri(higherLg.wage[0], higherLg.wage[1])/52);
        S.career.trophies.push({name:'Awans do '+higherLg.name, season:S.career.season});
      }
    }
    // SPADEK — ten sam klub spada do niższej ligi
    else if(curLg.relegatesTo && s.tablePos > clubsInLg - relegateSlots){
      var lowerLg = leagueByName(curLg.relegatesTo);
      if(lowerLg){
        var relegatedClub = {name:S.club.name, strength:S.club.strength, league:lowerLg.name, country:lowerLg.country, flag:lowerLg.flag, tier:lowerLg.tier};
        s.leagueMovement = {type:'relegated', from:curLg.name, to:lowerLg.name, newClub:relegatedClub};
        S.club = relegatedClub;
        S.leagueTier = lowerLg.tier;
        s.league = lowerLg.name;
        s.club = relegatedClub.name;
        p.weeklyWage = Math.round(ri(lowerLg.wage[0], lowerLg.wage[1])/52);
      }
    }
  }

  // WARTOŚĆ RYNKOWA
  s.marketValue = calcMarketValue();

  // POWRÓT Z WYPOŻYCZENIA
  if(S.loan && S.career.season >= S.loan.returnSeason){
    s.loanReturn = {from: S.club.name, to: S.loan.parentClub.name};
    S.club = S.loan.parentClub;
    S.leagueTier = S.loan.parentTier;
    var returnLg = leagueByName(S.club.league);
    if(returnLg){
      S.player.weeklyWage = ri(returnLg.wage[0], returnLg.wage[1]);
    }
    S.loan = null;
  }

  // PLAYSTYLE PROGRESS + REWOLUCYJNE AKTUALIZACJE
  var seasonRec = {avgRating:avgRating, tablePos:s.tablePos, goals:s.goals, assists:s.assists};
  grantPlaystyleProgress(seasonRec);
  updateCoachTrust(seasonRec);
  updateBigGameMentality(seasonRec);
  updateMentorship();
  computeLegacyScore();

  if(p.age>=38 || (p.age>=33 && p.ovr<60)){
    S.view='retire';
    return;
  }

  save();
  S.view='seasonReport';
}

function handleNationalTeam(avgRating){
  const p=S.player, nat=S.player.nationality, grp=posGroup(p.position);
  if(!nat) return;
  if(!S.national.inSquad && p.ovr>=nat.callupOvr && p.reputation>=8){
    const compMod = nat.strength>=85 ? 0.5 : 1;
    if(Math.random() < (0.4 + (p.ovr-nat.callupOvr)/20) * compMod){
      S.national.inSquad=true;
    }
  }
  if(S.national.inSquad){
    const ntMatches = ri(3,9);
    S.national.caps += ntMatches;
    if(grp==='GK'){
      const cs = poisson(0.35*(p.ovr/80));
      S.national.cleanSheets = (S.national.cleanSheets||0) + cs;
    } else {
      const g = poisson(0.3 * (p.ovr/80));
      const a = poisson(0.25 * (p.ovr/80));
      S.national.goals += g + a;
    }
    p.reputation = clamp(p.reputation + 1, 0, 100);
  }
  const legendMetric = grp==='GK' ? (S.national.cleanSheets||0) : S.national.goals;
  if(S.national.caps>=nat.legendCaps && legendMetric>=(grp==='GK'?Math.round(nat.legendGoals*0.5):nat.legendGoals)){
    S.national.legendStatus = 'Legenda Reprezentacji '+nat.name;
    S.career.legendOf = nat.name;
  } else if(S.national.caps>=nat.legendCaps*0.6){
    S.national.legendStatus = 'Idol '+nat.name;
  }

  const isTournamentYear = (S.career.season % 2 === 0);
  if(isTournamentYear && S.national.inSquad){
    runTournament();
  }
}

function runTournament(){
  const p=S.player, nat=S.player.nationality, grp=posGroup(p.position);
  const isWorldCup = (Math.floor(S.career.season/2)) % 2 === 0;
  const tName = isWorldCup ? 'Mistrzostwa Świata' : 'Puchar Kontynentalny ('+nat.conf+')';
  const perf = (p.ovr/100)*0.7 + (nat.strength/100)*0.3;
  let rounds = ['Faza grupowa','1/8 finału','Ćwierćfinał','Półfinał','Finał'];
  let goalsInTourn=0, assistsInTourn=0, cleanSheetsInTourn=0;
  const r=Math.random();
  const advance = clamp((perf-0.55)*4 + (p.form/100), -0.3, 1.2);
  let stageIdx=0;
  for(let i=0;i<rounds.length;i++){
    if(r + advance/5 > 0.5 || i===0){
      stageIdx=i;
      if(grp==='GK'){
        if(Math.random()<0.4+perf*0.3) cleanSheetsInTourn++;
      } else {
        const g = poisson(0.4*perf+0.1);
        const a = poisson(0.3*perf);
        goalsInTourn+=g; assistsInTourn+=a;
      }
      if(i<rounds.length-1 && Math.random() > 0.35 + advance*0.2) break;
      stageIdx=i+1;
    } else break;
  }
  const reached = rounds[Math.min(stageIdx, rounds.length-1)];
  S.national.caps += ri(3,7);
  if(grp==='GK') S.national.cleanSheets=(S.national.cleanSheets||0)+cleanSheetsInTourn;
  else S.national.goals += goalsInTourn;
  S.national.tournaments.push({name:tName, season:S.career.season, stage:reached, goals:goalsInTourn, assists:assistsInTourn, cleanSheets:cleanSheetsInTourn, posGroup:grp});
  if(reached==='Finał'){
    p.reputation=clamp(p.reputation+8,0,100);
    S.flags.achievements.add('finalista_turnieju');
  }
  if(reached==='Finał' && Math.random()<0.4+advance*0.3){
    S.career.trophies.push({name:'Zwycięstwo: '+tName, season:S.career.season});
    p.reputation=clamp(p.reputation+12,0,100);
    S.flags.achievements.add('mistrz_turnieju');
  }
}

/* ============================================================
   TRANSFERY PROPORCJONALNE
   fee/wage = f(OVR gracza x siła klubu). Klub marzenia dla topowych.
   ============================================================ */
function proportionalFee(ovr, clubStrength, tier){
  // Opłata transferowa w euro
  // OVR 50 w tier 1: ~50k-300k, OVR 90 w tier 5: ~80-200mln
  const base = Math.pow(ovr/50, 5.0) * 500000;
  const clubMult = 0.35 + (clubStrength/100)*2.2;
  const tierMult = 0.25 + tier*0.35;
  return Math.round(base * clubMult * tierMult);
}
function proportionalWage(ovr, clubStrength, tier){
  // Pensja tygodniowa - realistyczna skala
  // OVR 50 w tier 1: ~500-1500/tydz, OVR 90 w tier 5: ~200-500k/tydz
  const base = Math.pow(ovr/50, 4.5) * 1500;
  const clubMult = 0.35 + (clubStrength/100)*2.5;
  const tierMult = 0.25 + tier*0.4;
  return Math.round(base * clubMult * tierMult);
}
function proportionalSigningBonus(ovr, wage){
  // Bonus za podpis = ~3-8 miesięcy pensji
  return Math.round(wage*52*0.15*(ovr/60));
}

function generateTransferOffers(){
  const p=S.player;
  const offers=[];
  const numOffers = ri(2,4);
  // Transfer stopniowy: max 1 tier wyżej niż obecny, lub ten sam tier
  const currentTier = S.leagueTier || 1;
  for(let i=0;i<numOffers;i++){
    // 60% szans na ten sam tier, 40% na +1 wyżej
    const tier = Math.random() < 0.6 ? currentTier : Math.min(5, currentTier + 1);
    const club = makeClub(tier);
    const fee = proportionalFee(p.ovr, club.strength, tier);
    const wage = proportionalWage(p.ovr, club.strength, tier);
    const signingBonus = proportionalSigningBonus(p.ovr, wage);
    const dream = tier===5 && p.ovr>=82 && Math.random()<0.15;
    offers.push({club, tier, fee, wage, signingBonus, dream});
  }
  // Oferta elitarna tylko jeśli gracz już jest w tier 4+ i ma OVR 78+
  if(p.ovr>=78 && currentTier>=4 && Math.random()<0.25){
    const elite = makeClub(5); elite.strength=ri(90,96);
    const fee = proportionalFee(p.ovr, elite.strength, 5)*1.4;
    const wage = proportionalWage(p.ovr, elite.strength, 5)*1.5;
    offers.push({club:elite, tier:5, fee:Math.round(fee), wage:Math.round(wage), signingBonus:proportionalSigningBonus(p.ovr,wage), dream:true, jackpot:true});
  }
  return offers;
}

   ŚLEDZONE ROZGRYWKI (do 5) — symulacja innych lig
   ============================================================ */
function getTrackableLeagues(){
  return LEAGUES.map(l=>({name:l.name, country:l.country, flag:l.flag, tier:l.tier}));
}

function simTrackedLeague(leagueName){
  const lg = LEAGUES.find(l=>l.name===leagueName);
  if(!lg) return null;
  const clubs = lg.clubs.map(([name,strength])=>({name,strength}));
  const table = initLeagueTable(clubs);
  const fixtures = generateFixtures(clubs);
  const results = [];
  // symuluj wszystkie kolejki
  for(let md=0;md<fixtures.length;md++){
    for(const [hi,ai] of fixtures[md]){
      const home=table[hi], away=table[ai];
      const r=simulateClubMatch(home,away);
      applyResultToTable(table, home.name, away.name, r.hg, r.ag);
      results.push({md:md+1, home:home.name, away:away.name, hg:r.hg, ag:r.ag});
    }
  }
  const sorted = sortTable(table);
  // top strzelcy (generuj fikcyjnych)
  const scorers = sorted.slice(0,10).map((t,i)=>({
    name:genPlayerName(), club:t.name, goals:ri(25-i*2, 35-i*2), assists:ri(3,12)
  })).sort((a,b)=>b.goals-a.goals);
  const keepers = sorted.slice(0,8).map((t,i)=>({
    name:genPlayerName(), club:t.name, cleanSheets:ri(18-i, 25-i), savePct:ri(65,82)
  })).sort((a,b)=>b.cleanSheets-a.cleanSheets);
  return {name:leagueName, table:sorted, topScorers:scorers, topKeepers:keepers, results:results.slice(-50), champion:sorted[0]?.name};
}

function genPlayerName(){
  const first=['Jan','Pedro','Marco','Luca','Kai','Yuto','David','Sergej','Nico','Pierre','Diego','Andrei','Omar','Florian','Mateusz','Ibrahim','Carlos','Anton','Luka','Emre','Rafael','Bram','Stefan','Yanis','Joao'];
  const last=['Silva','Müller','Rossi','Costa','Novak','Yamamoto','Diaz','Kowalski','Lopez','Petrov','Tanaka','Schmidt','Dubois','Andersson','Khan','Pereira','Varga','Bauer','Moreau','Ito','Garcia','Weber','Larsen','Costa','Bianchi'];
  return pick(first)+' '+pick(last);
}

function simAllTrackedLeagues(){
  if(!S.world) S.world={tracked:[],leagues:{},cups:{},seasonSummaries:[]};
  S.world.leagues = {};
  // zawsze symuluj ligę gracza
  const playerLeague = S.season.league || (S.club&&S.club.league);
  const allTracked = [...new Set([playerLeague, ...S.world.tracked].filter(Boolean))].slice(0,5);
  for(const ln of allTracked){
    if(ln) S.world.leagues[ln] = simTrackedLeague(ln);
  }
}

function applyTrainingPlan(planId){
  const plan = TRAINING_PLANS.find(p=>p.id===planId);
  if(!plan) return;
  const p = S.player;
  // koszt
  if(p.wealth < plan.cost){ toast('Za mało środków na trening!'); return; }
  p.wealth -= plan.cost;
  // boost atrybutu
  if(plan.attr && p.attributes && p.attributes[plan.attr]!==undefined){
    p.attributes[plan.attr] = clamp(+(p.attributes[plan.attr]+plan.attrBoost).toFixed(1), 20, 99);
  }
  // boost OVR
  if(plan.ovrBoost){
    p.ovr = clamp(+(p.ovr+plan.ovrBoost).toFixed(1), 30, 99);
  }
  // zmęczenie → forma spada
  if(plan.fatigue>0){
    p.form = clamp(p.form - plan.fatigue, 20, 99);
  } else if(plan.fatigue<0){
    p.form = clamp(p.form - plan.fatigue, 20, 99); // fatigue negative = regeneracja
  }
  // ryzyko kontuzji
  if(plan.injuryRisk>0 && Math.random()<plan.injuryRisk){
    p.health = clamp(p.health - ri(10,25), 0, 100);
    toast('Niestety, trening skończył się drobną kontuzją!');
  }
  // bonus zdrowia
  if(plan.healthBoost) p.health = clamp(p.health + plan.healthBoost, 0, 100);
  if(plan.moraleBoost) p.morale = clamp(p.morale + plan.moraleBoost, 0, 100);
  // zapisz
  S.training.selectedPlan = planId;
  S.training.history.push({season:S.career.season+1, plan:plan.label});
  save();
  toast('Trening zakończony: '+plan.label);
}

  // cel minut (dla młodych)
  if(p.age<=21){
    goals.push({id:'minutes', who:'Trener', label:'Zagraj 1800+ minut', target:1800, type:'minutes', check:(s)=>(s.minutes||0)>=1800, reward:{pot:1,rep:1}});
  }
  return goals;
}

function evaluateGoals(s){
  if(!S.goals || !S.goals.current) return [];
  const results = [];
  S.goals.current.forEach(g=>{
    const met = g.check(s);
    const r = {label:g.label, who:g.who, met, reward:g.reward};
    if(met && g.reward){
      if(g.reward.rep) S.player.reputation=clamp(S.player.reputation+g.reward.rep,0,100);
      if(g.reward.wealth) S.player.wealth+=g.reward.wealth;
      if(g.reward.morale) S.player.morale=clamp(S.player.morale+g.reward.morale,0,100);
      if(g.reward.pot) S.player.potential=clamp(S.player.potential+g.reward.pot,S.player.ovr,99);
    }
    results.push(r);
  });
  S.goals.history.push({season:S.career.season+1, results});
  return results;
}

function rollDecisions(){
  const n = ri(1,3);
  const chosen=[];
  const pool = DECISION_TEMPLATES.slice();
  for(let i=0;i<n && pool.length;i++){
    const idx=ri(0,pool.length-1);
    chosen.push({...pool.splice(idx,1)[0], chosen:null});
  }
  return chosen;
}

function applyDecisionEffects(decision, choiceIdx){
  const choice = decision.choices[choiceIdx];
  if(!choice) return;
  const e = choice.effects||{};
  const p=S.player;
  if(e.morale) p.morale=clamp(p.morale+e.morale,0,100);
  if(e.form) p.form=clamp(p.form+e.form,0,100);
  if(e.health) p.health=clamp(p.health+e.health,0,100);
  if(e.rep) p.reputation=clamp(p.reputation+e.rep,0,100);
  if(e.chemistry) S.team.chemistry=clamp(S.team.chemistry+e.chemistry,0,100);
  if(e.followers) S.brand.followers=Math.max(0,S.brand.followers+e.followers);
  if(e.marketability) S.brand.marketability=clamp(S.brand.marketability+e.marketability,0,100);
  if(e.wealth) p.wealth=Math.max(0,p.wealth+e.wealth);
  S.decisions.history.push({season:S.career.season+1, title:decision.title, choice:choice.label});
  save();
}

function evaluateAwards(rec){
  const p=S.player, grp=posGroup(p.position);
  const awards=[];
  // generuj konkurentów
  const leagueName = rec.league || S.season.league;
  const competitors = [];
  for(let i=0;i<10;i++){
    competitors.push({name:genPlayerName(), goals:ri(8,28), assists:ri(2,15), rating:6.5+Math.random()*1.5, cleanSheets:ri(5,20)});
  }
  // Król strzelców
  if(grp==='ST'||grp==='WG'){
    const myGoals = rec.goals||0;
    const maxComp = Math.max(...competitors.map(c=>c.goals));
    if(myGoals >= maxComp){
      awards.push({name:'Król Strzelców '+leagueName, type:'scorer', season:rec.season});
      S.player.reputation=clamp(S.player.reputation+5,0,100);
      S.flags.achievements.add('top_scorer');
    }
  }
  // Król asyst
  if(grp==='MF'||grp==='WG'){
    const myA = rec.assists||0;
    const maxComp = Math.max(...competitors.map(c=>c.assists));
    if(myA >= maxComp){
      awards.push({name:'Król Asyst '+leagueName, type:'assister', season:rec.season});
      S.player.reputation=clamp(S.player.reputation+4,0,100);
    }
  }
  // Najlepszy bramkarz
  if(grp==='GK'){
    const myCS = rec.pos.cleanSheets||0;
    const maxComp = Math.max(...competitors.map(c=>c.cleanSheets));
    if(myCS >= maxComp){
      awards.push({name:'Najlepszy Bramkarz '+leagueName, type:'keeper', season:rec.season});
      S.player.reputation=clamp(S.player.reputation+5,0,100);
      S.flags.achievements.add('top_keeper');
    }
  }
  // Piłkarz sezonu ligi (na podstawie avg rating + gole + MOTM)
  const myScore = (rec.avgRating||6) + (rec.MOTM||0)*0.3 + (rec.goals||0)*0.1 + (rec.assists||0)*0.08;
  const maxCompScore = Math.max(...competitors.map(c=>c.rating + c.goals*0.1));
  if(myScore >= maxCompScore && rec.avgRating>=7.0){
    awards.push({name:'Piłkarz Sezonu '+leagueName, type:'mvp', season:rec.season});
    S.player.reputation=clamp(S.player.reputation+6,0,100);
    S.flags.achievements.add('mvp_league');
  }
  // Najlepszy młody zawodnik
  if(p.age<=21 && rec.avgRating>=6.8){
    awards.push({name:'Odkrycie Sezonu '+leagueName, type:'young', season:rec.season});
    S.player.reputation=clamp(S.player.reputation+4,0,100);
    S.flags.achievements.add('young_player');
  }
  // Złota Piłka (globalnie — tylko dla topowych)
  if(p.ovr>=85 && rec.avgRating>=7.5 && (rec.goals>=20||rec.assists>=15||(grp==='GK'&&(rec.pos.cleanSheets||0)>=15))){
    if(Math.random()<0.3){
      awards.push({name:'Złota Piłka', type:'ballon_or', season:rec.season});
      S.player.reputation=clamp(S.player.reputation+15,0,100);
      S.flags.achievements.add('ballon_dor');
    }
  }
  // Rekord klubowy (gole w sezonie)
  if((rec.goals||0)>=25){
    awards.push({name:'Rekord Klubu — '+rec.goals+' goli', type:'club_record', season:rec.season});
    S.flags.achievements.add('club_record_goals');
  }
  // Zapisz nagrody
  awards.forEach(a=>S.awards.history.push(a));
  return awards;
}

/* ============================================================
   TRANSFERY 2.0 — negocjacje, role, wypożyczenia
   ============================================================ */
function generateTransferOffersV2(){
  const p=S.player;
  const offers=[];
  const numOffers = ri(2,4);
  const currentTier = S.leagueTier || 1;
  // Max tier na podstawie OVR — niski OVR nie dostaje ofert z top lig
  const maxTierForOvr = p.ovr<58?2:(p.ovr<65?3:(p.ovr<72?4:5));
  for(let i=0;i<numOffers;i++){
    const rawTier = Math.random() < 0.6 ? currentTier : Math.min(5, currentTier + 1);
    const tier = Math.min(rawTier, maxTierForOvr);
    let club = makeClub(tier);
    // Filtr siły — klub nie może być o więcej niż 15 OVR silniejszy
    let attempts=0;
    while(club.strength - p.ovr > 15 && attempts<5){
      club = makeClub(tier);
      attempts++;
    }
    // Jeśli nadal za silny, zmniejsz tier
    if(club.strength - p.ovr > 15){
      club = makeClub(Math.max(1, tier-1));
    }
    const fee = proportionalFee(p.ovr, club.strength, tier);
    const wage = proportionalWage(p.ovr, club.strength, tier);
    const signingBonus = proportionalSigningBonus(p.ovr, wage);
    const dream = tier===5 && p.ovr>=82 && Math.random()<0.15;
    // rola w zespole
    const ovrDiff = p.ovr - club.strength;
    let role = 'Rotacja';
    if(ovrDiff>=5) role='Gwiazda';
    else if(ovrDiff>=-3) role='Starter';
    else if(ovrDiff>=-8) role='Rotacja';
    else role='Rezerwowy';
    // presja
    const pressure = clamp(club.strength - p.ovr + 10, 0, 100);
    // obietnica gry
    const promise = role==='Gwiazda'?'Regularna gra w pierwszym składzie':
                    role==='Starter'?'Miejsce w pierwszym składzie':
                    role==='Rotacja'?'Szansa na rotację':'Walka o miejsce';
    // SZANSE % na grę/wypożyczenie/sprzedaż
    var chances = calcCareerChances(club, role);
    offers.push({club, tier, fee, wage, signingBonus, dream, role, pressure, promise, years:ri(2,5), loan:false, chances:chances});
  }
  // Oferta elitarna
  if(p.ovr>=78 && currentTier>=4 && Math.random()<0.25){
    const elite = makeClub(5); elite.strength=ri(90,96);
    const fee = proportionalFee(p.ovr, elite.strength, 5)*1.4;
    const wage = proportionalWage(p.ovr, elite.strength, 5)*1.5;
    var eliteChances = calcCareerChances(elite, 'Gwiazda');
    offers.push({club:elite, tier:5, fee:Math.round(fee), wage:Math.round(wage), signingBonus:proportionalSigningBonus(p.ovr,wage), dream:true, jackpot:true, role:'Gwiazda', pressure:30, promise:'Regularna gra w pierwszym składzie', years:ri(3,5), loan:false, chances:eliteChances});
  }
  // Oferta wypożyczenia (dla młodych lub niższy OVR)
  if(p.age<=22 || (p.ovr<70 && Math.random()<0.4)){
    const loanTier = Math.max(1, currentTier-1);
    const loanClub = makeClub(loanTier);
    const loanWage = proportionalWage(p.ovr, loanClub.strength, loanTier)*0.5;
    var loanChances = calcCareerChances(loanClub, 'Starter');
    // Przy wypożyczeniu szansa gry jest wyższa
    loanChances.playChance = Math.min(85, loanChances.playChance + 20);
    loanChances.loanChance = 100 - loanChances.playChance - 5;
    loanChances.saleChance = 5;
    offers.push({club:loanClub, tier:loanTier, fee:0, wage:Math.round(loanWage), signingBonus:0, dream:false, role:'Starter', pressure:5, promise:'Regularna gra dla rozwoju', years:1, loan:true, chances:loanChances});
  }
  return offers;
}

function negotiateOffer(offer, type, boost){
  // type: 'wage' lub 'role' lub 'years'
  // boost: boolean — czy gracz ma bonus negocjacyjny ze sklepu
  const p=S.player;
  const repFactor = p.reputation/100;
  const formFactor = p.form/100;
  let successChance = 0.3 + repFactor*0.3 + formFactor*0.2;
  if(boost) successChance += 0.2; // bonus ze sklepu
  if(Math.random() > successChance){
    return {success:false, msg:'Klub odrzucił twoje żądania.'};
  }
  if(type==='wage'){
    const newWage = Math.round(offer.wage * (1.1 + Math.random()*0.15));
    offer.wage = newWage;
    return {success:true, msg:'Pensja wynegocjowana: '+money(newWage)+'/tydz.', offer};
  }
  if(type==='role'){
    const roles=['Rezerwowy','Rotacja','Starter','Gwiazda'];
    const idx = roles.indexOf(offer.role);
    if(idx<roles.length-1){
      offer.role = roles[idx+1];
      offer.promise = offer.role==='Gwiazda'?'Regularna gra w pierwszym składzie':'Miejsce w pierwszym składzie';
      return {success:true, msg:'Rola podniesiona: '+offer.role, offer};
    }
    return {success:false, msg:'Nie można podnieść roli wyżej.'};
  }
  if(type==='years'){
    offer.years = Math.min(5, offer.years+1);
    return {success:true, msg:'Kontrakt wydłużony do '+offer.years+' lat.', offer};
  }
  return {success:false, msg:'Nieznany typ negocjacji.'};
}

function renderPlaystyleView(){
  if(!S.playstyles) S.playstyles={selected:[],points:0,maxExtra:2,extraUnlocked:0,history:[]};
  var sel=S.playstyles.selected;
  var pts=S.playstyles.points||0;

  html+='<div class="sub">Twoje aktywne style i progresja</div>';
  html+='<div class="notice gold mb">Punkty playstyle: <b>'+pts+'</b> — użyj do odblokowania/wzmocnienia stylów</div>';

  else {
    html+='<div class="opt-grid">';

      if(canUpgrade) html+='<button class="btn btn-sm btn-primary" data-upgrade="'+i+'" style="margin-top:6px">Wzmocnij (3 pkt)</button>';
      else if(s.level>=3) html+='<div class="muted" style="font-size:11px;margin-top:4px">Maksymalny poziom</div>';
      html+='</div>';
    });
    html+='</div>';
  }
  html+='</div>';

  if(extraAvail>0&&pts>=5){
    html+='<button class="btn btn-primary" id="unlockExtra" style="margin-bottom:12px">Odblokuj dodatkowy styl (5 pkt)</button>';
  }
  // Lista dostępnych do dodania jeśli odblokowano slot
  if((S.playstyles.extraUnlocked||0)>0&&sel.length<5+(S.playstyles.extraUnlocked||0)){
    var pos=S.player.position;
    var available=playstylesForPosition(pos);
    var notSel=available.filter(function(p){return !sel.find(function(s){return s.id===p.id;});});
    if(notSel.length){
      html+='<div class="card mb"><h3>Dostępne do dodania</h3><div class="opt-grid">';
      notSel.forEach(function(p){
        var tier=playstyleTier(p.id);
        var tName=tier==='diamond'?'💎':(tier==='gold'?'🥇':'🥈');
        if(pts>=3) html+='<button class="opt" data-addps="'+p.id+'">'+tName+' '+p.name+'<small>'+p.desc+'</small></button>';
      });
      html+='</div></div>';
    }
  }
  html+='<button class="btn" onclick="S.view=\'dashboard\';render()">‹ Wróć</button>';
  html+='</section>';
  setView(html);
  $$('[data-upgrade]').forEach(function(b){
    b.onclick=function(){
      var i=+b.dataset.upgrade;
      if(S.playstyles.points>=3){
        S.playstyles.points-=3;
        S.playstyles.selected[i].level=(S.playstyles.selected[i].level||0)+1;
        save(); render();
      }
    };
  });
  if($('#unlockExtra')) $('#unlockExtra').onclick=function(){
    if(S.playstyles.points>=5){ S.playstyles.points-=5; S.playstyles.extraUnlocked=(S.playstyles.extraUnlocked||0)+1; save(); render(); }
  };
  $$('[data-addps]').forEach(function(b){
    b.onclick=function(){
      if(S.playstyles.points>=3){
        S.playstyles.points-=3;
        var id=b.dataset.addps;
        S.playstyles.selected.push({id:id,tier:playstyleTier(id),level:0});
        save(); render();
      }
    };
  });
}

function renderNaturalization(){

      connected.forEach(function(c){

      html+='<div class="muted" style="padding:4px 0">Sezon '+h.season+': '+h.from+' → '+h.to+'</div>';
    });
    html+='</div>';

  html+='<button class="btn" onclick="S.view=\'dashboard\';render()">‹ Wróć</button>';

function bar(label,val,unit='',cls=''){
  const pct=clamp(val,0,100);
  return `<div class="bar-row mt" style="margin-top:8px"><span>${label}</span><div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div><span class="bar-val">${Math.round(val)}${unit}</span></div>`;
}
function meter(label,val,max,unit=''){
  const pct=clamp(val/max*100,0,100);
  return `<div class="meter-row"><span>${label}</span><div class="bar-track"><div class="bar-fill gold" style="width:${pct}%"></div></div><span class="bar-val">${fmt(val)}${unit}</span></div>`;
}

function renderPlaystyleSelect(){
  if(!S.playstyles) S.playstyles={selected:[],points:0,maxExtra:2,extraUnlocked:0,history:[]};
  var pos=S.player.position;
  var group=playstyleGroup(pos);
  var available=playstylesForPosition(pos);
  var sel=S.playstyles.selected;
  var diamondSel=sel.filter(function(s){return s.tier==='diamond';}).length;
  var goldSel=sel.filter(function(s){return s.tier==='gold';}).length;
  var normalSel=sel.filter(function(s){return s.tier==='normal';}).length;
  var html='<section class="panel">';
  html+='<h2>Wybierz style gry</h2>';
  html+='<div class="sub">Pozycja: '+pos+' (grupa: '+group+') — wybierz 1 diamentowy, 2 złote i 2 zwykłe</div>';
  html+='<div class="notice mb">'+
    'Wybrano: '+(diamondSel>0?'💎 '+diamondSel:'')+(goldSel>0?' 🥇 '+goldSel:'')+(normalSel>0?' 🥈 '+normalSel:'')+
    ' — pozostało: 💎 '+(1-diamondSel)+' 🥇 '+(2-goldSel)+' 🥈 '+(2-normalSel)+
  '</div>';
  var tiers=[
    {key:'diamond',label:'💎 Diamentowe',max:1,color:'#c41e3a'},
    {key:'gold',label:'🥇 Złote',max:2,color:'#d4861b'},
    {key:'normal',label:'🥈 Zwykłe',max:2,color:'#95a5a6'}
  ];
  tiers.forEach(function(t){
    var items=available.filter(function(p){return playstyleTier(p.id)===t.key;});
    if(!items.length) return;
    var count=sel.filter(function(s){return s.tier===t.key;}).length;
    html+='<div class="card mb" style="border-left:4px solid '+t.color+'">';
    html+='<h3 style="margin:0 0 8px;color:'+t.color+'">'+t.label+' ('+count+'/'+t.max+')</h3>';
    html+='<div class="opt-grid">';
    items.forEach(function(p){
      var isSel=sel.find(function(s){return s.id===p.id;});
      var canSel=!isSel&&count<t.max;
      html+='<button class="opt '+(isSel?'active':'')+'" data-ps="'+p.id+'" data-tier="'+t.key+'" '+(isSel||canSel?'':'disabled')+' style="'+(!isSel&&!canSel?'opacity:0.4;cursor:not-allowed;':'')+'">'+
        p.name+'<small>'+p.desc+'</small></button>';
    });
    html+='</div></div>';
  });
  html+='<div class="row-between mt2">';
  html+='<button class="btn" id="psBack">‹ Wróć</button>';
  html+='<button class="btn btn-primary btn-lg" id="psNext" '+(sel.length<5?'disabled':'')+'>Dalej ›</button>';
  html+='</div>';
  html+='</section>';
  setView(html);
  $$('[data-ps]').forEach(function(b){
    b.onclick=function(){
      var id=b.dataset.ps, tier=b.dataset.tier;
      var idx=sel.findIndex(function(s){return s.id===id;});
      if(idx>=0) sel.splice(idx,1);
      else {
        var cnt=sel.filter(function(s){return s.tier===tier;}).length;
        var max=tier==='diamond'?1:(tier==='gold'?2:2);
        if(cnt<max) sel.push({id:id,tier:tier,level:0});
      }
      save(); render();
    };
  });
  $('#psBack').onclick=function(){S.view='create';render();};
  $('#psNext').onclick=function(){
    S.view='clubSelect'; render();
  };
}

function startCareer(){
  const p=S.player;
  if(!p.name){ p.name='Anonimowy Piłkarz'; }
  if(!p.talentTier){ p.talentTier='sred'; }
  const tier=TALENT_TIERS.find(t=>t.id===p.talentTier)||TALENT_TIERS[1];
  p.ovr=tier.ovrStart; p.potential=tier.potStart;
  p.age=16; p.form=65; p.morale=70; p.health=100; p.reputation=5; p.wealth=0;
  p.attributes=generateAttributes(p.ovr, p.position);
  // Inicjalizacja historii życia
  if(!S.life) S.life={familyBackground:null,passionOrigin:null,support:50,resilience:50,importantPeople:[],activeEvent:null,history:[],cooldown:0,actionsUsed:{},dedication:null,foundationCreated:false,biographyCreated:false};
  if(!S.life.familyBackground) S.life.familyBackground = FAMILY_BACKGROUNDS[0].id;
  if(!S.life.passionOrigin) S.life.passionOrigin = PASSION_ORIGINS[0].id;
  S.life.importantPeople = generateImportantPeople(S.life.familyBackground);
  S.club=null; S.leagueTier=1; S.contract=null;
  S.career.season=0; S.career.history=[]; S.career.trophies=[];
  S.national={caps:0,goals:0,cleanSheets:0,inSquad:false,legendStatus:null,tournaments:[]};
  S.stats={matches:0,goals:0,assists:0,minutes:0,xG:0,xA:0,ratings:[],cards:0,MOTM:0,seasonsSim:0,cleanSheets:0,saves:0,tackles:0};
  S.brand={followers:1000,marketability:10,sponsorships:[]};
  S.team={chemistry:60};
  S.spendOwned={};
  S.flags.eggs=new Set(); S.flags.achievements=new Set();
  // Zastosuj bonusy z historii rodziny i pasji
  applyBackstoryBonuses();
  // Inicjalizacja systemów rewolucyjnych
  if(!S.playstyles) S.playstyles={selected:[],points:0,maxExtra:2,extraUnlocked:0,history:[]};
  if(!S.auxSet) S.auxSet={trades:[],maxTrades:2,lastChangedSeason:null};
  if(!S.naturalization) S.naturalization={roots:[],switched:false,history:[]};
  if(!S.revolution) S.revolution={tacticalRole:null,weakFoot:1,signatureMove:null,bigGameMentality:0,coachTrust:50,agentStyle:null,isCaptain:false,mentorship:null,legacyScore:0};
  S.view='playstyleSelect';
  render();
}


/* ---------- Wybór klubu startowego ---------- */
function renderClubSelect(){
  const p=S.player;
  const t=p.ovr;
  let suggestedTier = t>=70?3:(t>=58?2:1);
  if(p.difficulty==='trudny') suggestedTier=Math.max(1,suggestedTier-1);
  if(p.difficulty==='latwy') suggestedTier=Math.min(3,suggestedTier+1);

  // Filtruj ligi według sugerowanego tieru (i jednego wyżej/niżej dla wyboru)
  var tiers = [suggestedTier];
  if(suggestedTier<5) tiers.push(suggestedTier+1);
  if(suggestedTier>2) tiers.push(suggestedTier-1);
  
  var availableLeagues = LEAGUES.filter(l=>tiers.includes(l.tier));
  
  var html = '<section class="panel">';
  html += '<h2>Wybierz klub startowy</h2>';
  html += '<p class="muted mb">Możesz wybrać konkretny klub lub rozpocząć losowo. Twój OVR: '+Math.round(p.ovr)+' • Sugerowany poziom: Tier '+suggestedTier+'</p>';
  
  // Przycisk losowy
  html += '<div class="card mb" style="border:2px solid var(--accent);cursor:pointer;" onclick="selectStarterClub(null,null)">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
  html += '<div><b>🎲 Losowy klub</b><br><span class="muted">Bez wyboru — system dobierze klub odpowiedni do Twojego poziomu</span></div>';
  html += '<span class="btn-sm">Wybierz</span>';
  html += '</div></div>';
  
  // Grupuj ligi po kraju
  var byCountry = {};
  availableLeagues.forEach(lg=>{
    if(!byCountry[lg.country]) byCountry[lg.country]=[];
    byCountry[lg.country].push(lg);
  });
  
  html += '<h3 class="mt">Dostępne ligi:</h3>';
  Object.keys(byCountry).sort().forEach(country=>{
    html += '<div class="card mb">';
    html += '<h4>'+byCountry[country][0].flag+' '+country+'</h4>';
    byCountry[country].forEach(lg=>{
      html += '<div class="sub muted" style="margin:4px 0 8px;">'+lg.name+' (Tier '+lg.tier+', '+lg.clubs.length+' klubów)</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
      // Pokaż pierwsze 12 klubów, reszta pod "więcej"
      var clubsToShow = lg.clubs.slice(0,12);
      clubsToShow.forEach(c=>{
        var strengthColor = c[1]>=85?'#c41e3a':(c[1]>=75?'#d4861b':'#555');
        html += '<button class="btn-sm" style="border-color:'+strengthColor+'" onclick="selectStarterClub(\''+escapeQuote(c[0])+'\',\''+escapeQuote(lg.name)+'\')">'+c[0]+' ('+c[1]+')</button>';
      });
      if(lg.clubs.length>12){
        html += '<button class="btn-sm" onclick="toggleClubList(this,\''+escapeQuote(lg.name)+'\')">+ '+(lg.clubs.length-12)+' więcej...</button>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  
  html += '</section>';
  setView(html);
}

function escapeQuote(s){
  return String(s).replace(/'/g,"\\'");
}

function toggleClubList(btn, leagueName){
  var lg = leagueByName(leagueName);
  if(!lg) return;
  var container = btn.parentNode;
  btn.remove();
  lg.clubs.slice(12).forEach(c=>{
    var strengthColor = c[1]>=85?'#c41e3a':(c[1]>=75?'#d4861b':'#555');
    var b=document.createElement('button');
    b.className='btn-sm';
    b.style.borderColor=strengthColor;
    b.textContent=c[0]+' ('+c[1]+')';
    b.onclick=function(){ selectStarterClub(c[0], leagueName); };
    container.appendChild(b);
  });
}

function selectStarterClub(clubName, leagueName){
  if(clubName && leagueName){
    var lg = leagueByName(leagueName);
    if(lg){
      var club = clubFromLeague(lg, clubName);
      if(club){
        S.club = club;
        S.leagueTier = lg.tier;
        S.player.weeklyWage = ri(lg.wage[0], lg.wage[1]);
        S.contract = generateContract(S.player.ovr, lg.tier, S.player.weeklyWage);
      }
    }
  } else {
    assignStarterClub();
  }
  startSeason();
  save();
  S.view='dashboard';
  render();
  toast('Kariera rozpoczęta w '+S.club.name+'! Powodzenia.');
}

/* ---------- Mecz-po-meczu ---------- */
function renderMatchByMatch(){
  const p=S.player, s=S.season, grp=posGroup(p.position);
  const avgR = s.ratings.length? (s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length).toFixed(2) : '—';
  const lg=currentLeague()||leagueMetaForTier(S.leagueTier);
  const totalMatches = totalMatchesForSeason();
  const last = s.matches[s.matches.length-1];

  const headerStat = grp==='GK'
    ? `<div class="big-stat"><div class="v">${s.pos.saves||0}</div><div class="l">Obronione</div></div>
       <div class="big-stat"><div class="v">${s.pos.cleanSheets||0}</div><div class="l">Czyste konta</div></div>`
    : `<div class="big-stat"><div class="v">${s.goals}</div><div class="l">Gole</div></div>
       <div class="big-stat"><div class="v">${s.assists}</div><div class="l">Asysty</div></div>`;

  setView(`
    <section class="panel">
      <div class="row-between">
        <h2>Mecz ${s.played}/${totalMatches}</h2>
        <button class="btn btn-sm" id="quickBtn">⚡ Dokończ sezon</button>
      </div>
      <div class="sub">${S.club.name} • ${lg.name} ${s.streak>=3?`• 🔥 Seria: ${s.streak} ${s.streakType==='W'?'zwycięstw':'porażek'}`:''}</div>

      ${last?renderMatchCard(last):''}

      <div class="grid grid-4 mt">
        ${headerStat}
        <div class="big-stat"><div class="v">${avgR}</div><div class="l">Śr. ocena</div></div>
        <div class="big-stat"><div class="v">${s.MOTM}</div><div class="l">MOTM</div></div>
      </div>

      ${s.matches.length?`
        <div class="divider"></div>
        <h3 style="margin-bottom:8px">Ostatnie mecze</h3>
        <div class="match-feed">
          ${s.matches.slice(-10).reverse().map(m=>`
            <div class="match-row">
              <span class="res ${m.result==='W'?'r-9':(m.result==='L'?'r-low':'')}">${m.teamGoals}-${m.oppGoals}</span>
              <span class="opp">${m.role==='bench'?'(ława) ':' '}vs OVR ${m.opp} • ${m.minutes}' • ${grp==='GK'?`🧤${m.pos.saves||0} obr.`:`⚽${m.goals||0} 🅰${m.assists||0}`}</span>
              <span class="rating ${m.rating>=8.5?'r-9':(m.rating<5.5?'r-low':'')}">${m.rating}</span>
            </div>`).join('')}
        </div>`:''}

      <div class="row-between mt2">
        <button class="btn" id="backBtn">‹ Wróć</button>
        <button class="btn btn-pitch btn-lg" id="nextBtn">▶ Następny mecz</button>
      </div>
    </section>
  `);

  $('#nextBtn').onclick=()=>{
    const m=simOneMatch();
    if(S.view!=='matchByMatch'){ render(); return; }
    render();
    if(S.season.played>=totalMatches){
      setTimeout(()=>{ if(S.view==='matchByMatch'){ finalizeSeason(); render(); } },300);
    }
  };
  $('#quickBtn').onclick=()=>{ simQuickSeason(); render(); };
  $('#backBtn').onclick=()=>{S.view='dashboard';render();};
}

function renderMatchCard(m){
  const p=S.player, grp=posGroup(p.position);
  const resColor = m.result==='W'?'var(--color-success)':(m.result==='L'?'var(--color-danger)':'var(--color-text-muted)');
  const resTxt = m.result==='W'?'Zwycięstwo':(m.result==='L'?'Porażka':'Remis');
  let statChips='';
  if(grp==='GK'){
    statChips = `
      <span class="chip" style="font-size:var(--text-xs)">🧤 Obronione: <b>${m.pos.saves||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">🛡️ Czyste konto: <b>${m.pos.cleanSheets?'Tak':'Nie'}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">% obrony: <b>${m.pos.savePct||0}%</b></span>
      <span class="chip" style="font-size:var(--text-xs)">PSxG-GA: <b>${(m.pos.psxgMinusGA||0).toFixed(2)}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">Stracone: <b>${m.pos.goalsConceded||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">Dośr. przechwycone: <b>${m.pos.crossesStopped||0}/${m.pos.crossesFaced||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">Akcji libero: <b>${m.pos.sweeperActions||0}</b></span>`;
  } else if(grp==='DF'){
    statChips = `
      <span class="chip" style="font-size:var(--text-xs)">🛑 Odbiory: <b>${m.pos.tackles||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">Przechwyty: <b>${m.pos.interceptions||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">Wybicia: <b>${m.pos.clearances||0}</b></span>`;
  } else if(grp==='MF'){
    statChips = `
      <span class="chip" style="font-size:var(--text-xs)">🎯 Kluczowe podania: <b>${m.pos.keyPasses||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">Podania: <b>${m.pos.passes||0}</b> (${m.pos.passAcc||0}%)</span>
      <span class="chip" style="font-size:var(--text-xs)">Odbiory: <b>${m.pos.tackles||0}</b></span>`;
  } else {
    statChips = `
      <span class="chip" style="font-size:var(--text-xs)">⚽ Gole: <b>${m.goals||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">🅰 Asysty: <b>${m.assists||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">Strzały: <b>${m.pos.shots||0}</b></span>
      <span class="chip" style="font-size:var(--text-xs)">xG: <b>${m.xG||0}</b></span>`;
  }
  return `
    <div class="card mt" style="padding:16px;background:linear-gradient(135deg,var(--color-surface-2),var(--color-surface))">
      <div class="row-between">
        <div>
          <div style="font-family:var(--font-display);font-size:1.3rem;font-weight:700">${S.club.name} <span style="color:${resColor}">${m.teamGoals} - ${m.oppGoals}</span> Rywal (OVR ${m.opp})</div>
          <div class="muted" style="font-size:var(--text-sm)">${resTxt} • ${m.role==='bench'?'Ława rezerwowych':'W pierwszym składzie'} • ${m.minutes} minut</div>
        </div>
        <div style="text-align:center">
          <div style="font-family:var(--font-display);font-size:2rem;font-weight:700;color:${m.rating>=8.5?'var(--color-primary)':(m.rating<5.5?'var(--color-danger)':'inherit')}">${m.rating}</div>
          <div class="muted" style="font-size:var(--text-xs)">ocena</div>
        </div>
      </div>
      <div class="chips mt" style="gap:6px">
        ${statChips}
        ${m.cards?`<span class="chip" style="font-size:var(--text-xs);border-color:var(--color-warning)">🟨 ${m.cards}</span>`:''}
        ${m.MOTM?`<span class="chip" style="font-size:var(--text-xs);border-color:var(--color-primary);color:var(--color-primary)">⭐ MOTM</span>`:''}
        ${m.injured?`<span class="chip" style="font-size:var(--text-xs);border-color:var(--color-danger);color:var(--color-danger)">🤕 Kontuzja ${m.injured} dni</span>`:''}
      </div>
    </div>
  `;
}

const TRAINING_CATEGORIES = ['Trening','Trening Elite','Medycyna Premium','Technologia','Lifestyle Sportowy'];
function getItemPrice(o){
  if(TRAINING_CATEGORIES.includes(o.category)){
    const ovr = (S.player && S.player.ovr) || 0;
    return Math.round(o.cost * (1 + ovr/100) * SHOP_PRICE_MULT);
  }
  return Math.round(o.cost * SHOP_PRICE_MULT);
}

function renderShopItem(o){
  const owned=S.spendOwned[o.id];
  const price=getItemPrice(o);
  const affordable=S.player.wealth>=price;
  const tags=effTag(o.effects);
  return `
    <div class="shop-item ${owned?'owned':''}">
      <div class="si-top">
        <div><div class="si-name">${o.name}</div><div class="si-cat">${o.category}${o.rarity!=='zwykły'?' • '+o.rarity:''}</div></div>
      </div>
      <div class="si-desc">${o.desc}</div>
      <div class="si-effects">${tags.map(t=>`<span class="eff-tag ${t.pos?'pos':(t.neg?'neg':'')} ${o.rarity==='legendarny'?'gold':''}">${t.t}</span>`).join('')}</div>
      <div class="si-bottom">
        <span class="price">${money(price)}</span>
        <button class="btn btn-sm ${owned?'btn-ghost':'btn-primary'}" data-buy="${o.id}" ${owned||!affordable?'disabled':''}>${owned?'Posiadane':(affordable?'Kup':'Za mało')}</button>
      </div>
    </div>
  `;
}

function buyItem(id){
  const o=SPEND_OPTIONS.find(x=>x.id===id);
  if(!o||S.spendOwned[id]) return;
  const p=S.player;
  const price=getItemPrice(o);
  if(p.wealth<price){ toast('Za mało środków!'); return; }
  p.wealth-=price;
  S.spendOwned[id]=true;
  const e=o.effects;
  // NERF: efekty pomnożone przez SHOP_EFFECT_MULT
  if(e.ovr) p.ovr=clamp(p.ovr+e.ovr*SHOP_EFFECT_MULT,30,99);
  if(e.pot) p.potential=clamp(p.potential+e.pot*SHOP_EFFECT_MULT,p.ovr,99);
  if(e.morale) p.morale=clamp(p.morale+e.morale*SHOP_EFFECT_MULT,0,100);
  if(e.zdrowie) p.health=clamp(p.health+e.zdrowie*SHOP_EFFECT_MULT,0,100);
  if(e.rep) p.reputation=clamp(p.reputation+e.rep*SHOP_EFFECT_MULT,0,100);
  if(e.forma) p.form=clamp(p.form+e.forma*SHOP_EFFECT_MULT,0,100);
  if(e.wiek) p.age=Math.max(14,p.age-e.wiek*SHOP_EFFECT_MULT);
  if(o.name.includes('3347')) S.flags.eggs.add('discord_code');
  if(o.name.includes('Stoichkov')) S.flags.eggs.add('stoichkov_note');
  save();
  toast('Zakupiono: '+o.name);
  render({preserveScroll:true});
}

      from: S.club.name,
      to: offer.club.name,
      league: offer.club.league || leagueMetaForTier(offer.tier).name,
      fee: offer.fee,
      wage: finalWage,
      bonus: offer.signingBonus,
      role: offer.role || '—',
      loan: offer.loan || false
    });
    // LOGIKA WYPOŻYCZENIA — zapisz klub macierzysty i sezon powrotu
    if(offer.loan){
      S.loan = {
        parentClub: S.club,
        parentTier: S.leagueTier,
        returnSeason: S.career.season + 1
      };
    } else {
      S.loan = null;
    }
    S.club=offer.club;
    S.leagueTier=offer.tier;
    S.player.weeklyWage=finalWage;

    S.contract = generateContract(S.player.ovr, offer.tier, finalWage);

  });
  $('#stayBtn').onclick=()=>{
    S.transferOffers=null;
    startSeason();
    save();
    S.view='dashboard'; render();
  };
  $('#histBtn').onclick=()=>{S.view='transferHistory';render();};
}

/* ============================================================
   MAPA WPŁYWU — udział zawodnika w statystykach klubu
   ============================================================ */
function clubShareStats(){
  const cs=S.season?.clubStats;
  if(!cs) return null;
  const safe=(n)=>n||0;
  const goalShare = cs.goalsFor? (safe(cs.playerGoals)/cs.goalsFor*100) : 0;
  const assistShare = cs.goalsFor? (safe(cs.playerAssists)/cs.goalsFor*100) : 0;
  const xgShare = cs.xG? (safe(cs.playerXG)/cs.xG*100) : 0;
  const shotShare = cs.shots? (safe(cs.playerShots)/cs.shots*100) : 0;
  const motmShare = cs.wins+cs.draws+cs.losses? (safe(cs.playerMOTM)/(cs.wins+cs.draws+cs.losses)*100) : 0;
  const giShare = cs.goalsFor? ((safe(cs.playerGoals)+safe(cs.playerAssists))/cs.goalsFor*100) : 0;
  const gkCleanShare = grp=>grp==='GK' && cs.cleanSheets? (safe(S.season.pos?.cleanSheets)/cs.cleanSheets*100) : 0;
  return {goalShare,assistShare,xgShare,shotShare,motmShare,giShare,gkCleanShare,cs};
}

function renderInfluencePanel(){
  const cs=S.season?.clubStats;
  if(!cs) return '';
  const sh=clubShareStats();
  if(!sh) return '';
  const grp=posGroup(S.player.position);
  const bars = [
    {label:'Gole', val:sh.goalShare, color:'var(--color-primary)'},
    {label:'Gole+Asysty', val:sh.giShare, color:'#e8743b'},
    {label:'Asysty', val:sh.assistShare, color:'#3498db'},
    {label:'xG', val:sh.xgShare, color:'#9b59b6'},
    {label:'Strzały', val:sh.shotShare, color:'#1abc9c'},
    {label:'MOTM', val:sh.motmShare, color:'#f1c40f'},
  ];
  if(grp==='GK') bars.push({label:'Czyste konta', val:sh.gkCleanShare(grp), color:'#2ecc71'});
  return `
    <div class="card" style="padding:16px">
      <h3 style="font-size:var(--text-lg);margin-bottom:8px">Mapa wpływu</h3>
      <div class="sub" style="margin-bottom:10px">Twój udział w statystykach klubu (${S.club.name})</div>
      ${bars.map(b=>`
        <div class="impact-row">
          <div class="impact-label">${b.label}</div>
          <div class="impact-bar-bg">
            <div class="impact-bar-fill" style="width:${Math.min(100,b.val).toFixed(1)}%;background:${b.color}"></div>
          </div>
          <div class="impact-val">${b.val.toFixed(1)}%</div>
        </div>
      `).join('')}
      <div class="divider" style="margin:10px 0"></div>
      <div class="grid grid-2" style="font-size:var(--text-sm)">
        <div>Klub strzelił: <b>${cs.goalsFor}</b> gol.</div>
        <div>Klub stracił: <b>${cs.goalsAgainst}</b> gol.</div>
        <div>Strzały klubu: <b>${cs.shots}</b></div>
        <div>xG klubu: <b>${(cs.xG||0).toFixed(1)}</b></div>
        <div>Bilans W/R/P: <b>${cs.wins}/${cs.draws}/${cs.losses}</b></div>
        <div>Czyste konta klubu: <b>${cs.cleanSheets}</b></div>
      </div>
    </div>
  `;
}

/* ============================================================
   REKORDY KARIERY I SEZONU
   ============================================================ */
function ensureRecords(){
  if(!S.records) S.records={
    mostGoalsSeason:0, mostAssistsSeason:0, bestRatingSeason:0, mostCleanSheetsSeason:0,
    mostSavesSeason:0, highestTransferFee:0, mostTrophiesSeason:0, mostMOTMSeason:0,
    bestLeaguePos:99, careerGoals:0, careerAssists:0, careerMatches:0,
  };
  return S.records;
}

function updateRecords(rec){
  const r=ensureRecords();
  r.mostGoalsSeason=Math.max(r.mostGoalsSeason, rec.goals||0);
  r.mostAssistsSeason=Math.max(r.mostAssistsSeason, rec.assists||0);
  r.bestRatingSeason=Math.max(r.bestRatingSeason, parseFloat(rec.avgRating)||0);
  r.mostCleanSheetsSeason=Math.max(r.mostCleanSheetsSeason, rec.pos?.cleanSheets||0);
  r.mostSavesSeason=Math.max(r.mostSavesSeason, rec.pos?.saves||0);
  r.mostMOTMSeason=Math.max(r.mostMOTMSeason, rec.MOTM||0);
  r.mostTrophiesSeason=Math.max(r.mostTrophiesSeason, S.career.trophies.length);
  r.bestLeaguePos=Math.min(r.bestLeaguePos, rec.tablePos||99);
  r.careerGoals=S.stats.goals||0;
  r.careerAssists=S.stats.assists||0;
  r.careerMatches=S.stats.matches||0;
}

function checkSeasonRecords(rec){
  const r=ensureRecords();
  const banners=[];
  if((rec.goals||0)>0 && (rec.goals||0)>=r.mostGoalsSeason) banners.push({icon:'⚽',text:`Rekord kariery: ${rec.goals} goli w sezonie!`});
  if((rec.assists||0)>0 && (rec.assists||0)>=r.mostAssistsSeason) banners.push({icon:'🎯',text:`Rekord kariery: ${rec.assists} asyst w sezonie!`});
  if(parseFloat(rec.avgRating)>=r.bestRatingSeason) banners.push({icon:'⭐',text:`Rekord kariery: średnia ${rec.avgRating}!`});
  if((rec.MOTM||0)>0 && (rec.MOTM||0)>=r.mostMOTMSeason) banners.push({icon:'🏆',text:`Rekord kariery: ${rec.MOTM} meczów gracza meczu!`});
  if(posGroup(S.player.position)==='GK' && (rec.pos?.cleanSheets||0)>=r.mostCleanSheetsSeason) banners.push({icon:'🧤',text:`Rekord kariery: ${rec.pos?.cleanSheets||0} czystych kont!`});
  if((rec.tablePos||99)<=r.bestLeaguePos) banners.push({icon:'📊',text:`Rekord kariery: ${rec.tablePos} miejsce w lidze!`});
  updateRecords(rec);
  return banners;
}

function renderMonthlyFormChart(){
  const mf=S.season?.monthlyForm;
  if(!mf || !mf.length) return '';
  const months=['Sie','Wrz','Paź','Lis','Gru','Sty','Lut','Mar'];
  const maxRating=Math.max(...mf.filter(Boolean).map(m=>m.rating), 6);
  const minRating=Math.min(...mf.filter(Boolean).map(m=>m.rating), 5);
  const range=Math.max(maxRating-minRating, 0.5);
  return `
    <div class="card" style="padding:16px">
      <h3 style="font-size:var(--text-lg);margin-bottom:8px">Forma miesiąc po miesiącu</h3>
      <div class="monthly-chart">
        ${mf.map((m,i)=>{
          if(!m) return '';
          const h=40 + ((m.rating-minRating)/range)*50;
          const color=m.rating>=7?'#2ecc71':(m.rating>=6?'#f1c40f':'#e74c3c');
          return `<div class="mc-bar" title="${months[i]}: ${m.rating.toFixed(2)} ocena, ${m.goals}G ${m.assists}A">
            <div class="mc-bar-fill" style="height:${h}px;background:${color}"></div>
            <div class="mc-bar-label">${months[i]}</div>
            <div class="mc-bar-val">${m.rating.toFixed(1)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}
