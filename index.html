function renderClubListForTransfer(leagues){
  var html = '';
  var allClubs = allClubsFlat();
  // Sortuj po tierze i sile
  allClubs.sort(function(a,b){ return a.tier-b.tier || b.strength-a.strength; });
  allClubs.slice(0,60).forEach(function(c){
    var isCurrent = S.club && S.club.name===c.name && S.club.league===c.league;
    var isDream = S.dreamClubs && S.dreamClubs.some(function(d){return d.club===c.name && d.league===c.league;});
    var strengthColor = c.strength>=85?'#c41e3a':(c.strength>=75?'#d4861b':(c.strength>=65?'#27ae60':'#555'));
    html += '<div class="card mb" style="padding:8px;display:flex;justify-content:space-between;align-items:center;">';
    html += '<div><b>'+c.flag+' '+c.name+'</b> <span class="muted" style="font-size:var(--text-xs)">'+c.league+' • siła '+c.strength+'</span></div>';
    html += '<div style="display:flex;gap:4px;">';
    html += '<button class="btn-sm" style="border-color:'+strengthColor+'" onclick="showScoutReport(\''+escapeQuote(c.league)+'\',\''+escapeQuote(c.name)+'\')" title="Raport scouta">🔍</button>';
    if(!isCurrent){
      html += '<button class="btn-sm" onclick="doTransferRequest(\''+escapeQuote(c.league)+'\',\''+escapeQuote(c.name)+'\')">Poproś</button>';
    }
    if(isDream){
      html += '<span class="chip" style="border-color:var(--color-primary);color:var(--color-primary);font-size:var(--text-xs)">★</span>';
    } else if(S.dreamClubs && S.dreamClubs.length<3){
      html += '<button class="btn-sm" onclick="toggleDreamAndRender(\''+escapeQuote(c.league)+'\',\''+escapeQuote(c.name)+'\')" title="Dodaj do marzeń">☆</button>';
    }
    html += '</div></div>';
  });
  return html;
}
function filterClubList(query){
  query = (query||'').toLowerCase();
  var filtered = LEAGUES.map(function(lg){
    var clubs = lg.clubs.filter(function(c){return c[0].toLowerCase().indexOf(query)>=0;});
    if(clubs.length===0) return null;
    return {name:lg.name, country:lg.country, flag:lg.flag, tier:lg.tier, clubs:clubs, wage:lg.wage, rep:lg.rep, transferFee:lg.transferFee, promotesTo:lg.promotesTo, relegatesTo:lg.relegatesTo};
  }).filter(Boolean);
  var container = document.getElementById('clubListContainer');
  if(container) container.innerHTML = renderClubListForTransfer(filtered);
}
function showScoutReport(leagueName, clubName){
  var report = scoutReport(leagueName, clubName);
  if(!report){ toast('Nie można wygenerować raportu.'); return; }
  var msg = 'Raport scouta — '+report.club.flag+' '+report.club.name+':\n';
  msg += 'Liga: '+report.league.name+' (Tier '+report.league.tier+')\n';
  msg += 'Siła klubu: '+report.club.strength+' • Twój OVR: '+Math.round(S.player.ovr)+'\n';
  msg += 'Przewidywana pensja: '+money(report.expectedWage)+'/tydz.\n';
  msg += 'Budżet klubu: '+money(report.budgetMax)+'/tydz.\n';
  msg += 'Szansa akceptacji: '+report.chance+'%\n';
  if(report.tooWeak) msg += '⚠ Za słaby dla tego klubu!\n';
  if(report.cannotPay) msg += '⚠ Klub nie stać na pensję!\n';
  msg += 'Szanse gry: '+report.chances.playChance+'% | Wypoż.: '+report.chances.loanChance+'% | Sprzedaż: '+report.chances.saleChance+'%';
  alert(msg);
}
function doTransferRequest(leagueName, clubName){
  var result = requestTransferToClub(leagueName, clubName);
  toast(result.msg);
  if(result.success){
    setTimeout(function(){ S.view='transfers'; render(); }, 1500);
  }
}
function toggleDreamAndRender(leagueName, clubName){
  var result = toggleDreamClub(leagueName, clubName);
  if(result===null) toast('Max 3 kluby marzeń!');
  else if(result) toast('Dodano do klubów marzeń!');
  else toast('Usunięto z klubów marzeń.');
  render();
}

/* ---------- Konferencja prasowa ---------- */
function renderPressConference(){
  var questions = generatePressConference();
  var html = '<section class="panel">';
  html += '<h2> Konferencja prasowa</h2>';
  html += '<div class="sub mb">Sezon '+S.career.season+' • Odpowiedz na pytania dziennikarzy</div>';
  questions.forEach(function(q, qi){
    html += '<div class="card mb" style="padding:12px;">';
    html += '<div style="font-weight:600;margin-bottom:8px;">'+(qi+1)+'. '+q.q+'</div>';
    html += '<div style="display:flex;flex-direction:column;gap:6px;">';
    q.choices.forEach(function(c, ci){
      html += '<button class="btn btn-sm" onclick="answerPress('+qi+','+ci+')" style="text-align:left;">'+c.label+'</button>';
    });
    html += '</div></div>';
  });
  html += '</section>';
  setView(html);
}
function answerPress(qi, ci){
  var questions = generatePressConference();
  var choice = questions[qi].choices[ci];
  if(!choice) return;
  var e = choice.effects;
  if(e.rep) S.player.reputation = clamp(S.player.reputation + e.rep, 0, 100);
  if(e.morale) S.player.morale = clamp(S.player.morale + e.morale, 0, 100);
  if(e.form) S.player.form = clamp(S.player.form + e.form, 0, 100);
  if(e.chemistry) S.team.chemistry = clamp(S.team.chemistry + e.chemistry, 0, 100);
  if(e.ovr) S.player.ovr = clamp(S.player.ovr + e.ovr, 30, 99);
  if(e.health) S.player.health = clamp(S.player.health + e.health, 0, 100);
  if(e.followers) S.brand.followers += e.followers;
  toast('Dziękujemy za odpowiedź!');
  // Oznacz jako zrobione
  if(!S.pressConference) S.pressConference = {done:false, pending:false};
  S.pressConference.done = true;
  save();
  // Po ostatnim pytaniu wróć
  if(qi >= questions.length - 1){
    setTimeout(function(){ S.view='seasonReport'; render(); }, 800);
  } else {
    render();
  }
}

function renderStream(){

  var platforms=[
    {id:'twitch',name:'Twitch',icon:'🟣',mult:1.2,desc:'Najlepsza platforma dla gamingu'},
    {id:'youtube',name:'YouTube',icon:'▶️',mult:1.0,desc:'Największy zasięg globalny'},

  ];
  var html='<section class="panel"><h2>📺 Streaming</h2>';
  html+='<div class="sub mb">Obserwujący: '+fmt(S.stream.followers)+' • Łączne wyświetlenia: '+fmt(S.stream.totalViews)+'</div>';
  html+='<div class="sub mb">Sesje: '+S.stream.sessions+' • Dochód: '+money(S.stream.income)+'</div>';

    html+='<div class="divider"></div><h3>Wybierz platformę</h3><div class="grid grid-3 mt">';
    platforms.forEach(function(p){
      html+='<div class="card"><h3>'+p.icon+' '+p.name+'</h3><div class="sub">'+p.desc+'</div>';
      html+='<div class="mt">Mnożnik dochodu: '+p.mult+'x</div>';
      html+='<button class="btn btn-sm btn-primary mt" data-platform="'+p.id+'">Wybierz</button></div>';
    });
    html+='</div>';
  } else {
    var act=platforms.find(p=>p.id===S.stream.platform);
    html+='<div class="notice gold mt mb">Platforma: <b>'+act.icon+' '+act.name+'</b></div>';
    html+='<div class="card mt"><h3>Streamuj sesję</h3><div class="sub">Graj w gry, rozmawiaj z fanami, buduj markę</div>';
    html+='<button class="btn btn-primary mt" id="goLive">🔴 Streamuj (2h)</button></div>';
  }
  html+='<div class="center mt2"><button class="btn" id="backBtn">‹ Wróć</button></div></section>';
  setView(html);
  $('#backBtn').onclick=()=>{S.view='dashboard';render();};
  $$('[data-platform]').forEach(b=>b.onclick=()=>{
    S.stream.platform=b.dataset.platform;
    toast('Wybrano platformę!');
    save(); render({preserveScroll:true});
  });
  if($('#goLive')) $('#goLive').onclick=()=>{
    var act=platforms.find(p=>p.id===S.stream.platform);
    var views=ri(500,5000)+Math.round(S.brand.followers/100);
    var income=Math.round(views*act.mult*0.5);
    S.stream.followers+=ri(50,500);
    S.stream.totalViews+=views;
    S.stream.sessions++;
    S.stream.income+=income;
    S.player.wealth+=income;
    S.brand.followers+=ri(100,1000);
    toast('Stream zakończony! +'+money(income)+' • +'+ri(100,1000)+' obserwujących');
    save(); render({preserveScroll:true});
  };
}

/* 15. SKAUT — wyszukuj talenty */
function renderScout2(){
  if(!S.scout2) S.scout2={level:1, found:[], scouted:0, reports:[]};
  if(!S.scout2.reports.length || S.scout2.reports.length<3){
    var regions=['Afryka','Ameryka Południowa','Europa Wschodnia','Azja','Skandynawia','Ameryka Północna'];
    var pos=['ST','CM','CB','GK','LW','RW','CDM','CAM','LB','RB'];
    var names=['Kofi','Mateo','Diego','Emre','Sven','Carter','Yuki','Omar','Lucas','Anders','Kwame','Hiro','Pablo','Niko','Bjorn'];
    for(var i=S.scout2.reports.length;i<3;i++){
      var r=regions[ri(0,regions.length-1)];
      S.scout2.reports.push({
        name:names[ri(0,names.length-1)]+' '+names[ri(0,names.length-1)].charAt(0)+'.',
        age:ri(16,21), pos:pos[ri(0,pos.length-1)],
        ovr:ri(50,70), pot:ri(70,92),
        region:r, recommended:Math.random()>0.5
      });
    }
  }
  var html='<section class="panel"><h2>🔍 Skauting talentów</h2>';
  html+='<div class="sub mb">Poziom skauta: '+S.scout2.level+' • Znaleziono: '+S.scout2.found.length+' • Raporty: '+S.scout2.scouted+'</div>';
  html+='<div class="card mb" style="background:var(--color-surface-2)"><b>Regiony skautingowe:</b> Każdy raport to potencjalny talent. Rekomenduj go swojemu klubowi.</div>';
  html+='<div class="grid grid-3 mt">';
  S.scout2.reports.forEach(function(r,i){
    var stars=Math.round((r.pot-50)/10);
    html+='<div class="card"><div class="big-stat"><div class="v">'+r.ovr+'</div><div class="l">'+r.name+'</div></div>';
    html+='<div class="sub">'+r.age+' lat • '+r.pos+' • '+r.region+'</div>';
    html+='<div class="mt">POT: <b>'+r.pot+'</b> '+'⭐'.repeat(Math.max(1,stars))+'</div>';
    if(r.recommended) html+='<div class="notice gold mt" style="font-size:11px">⭐ Rekomendowany</div>';
    html+='<div class="mt" style="display:flex;gap:4px">';
    html+='<button class="btn btn-sm btn-primary" data-scout-rec="'+i+'">Rekomenduj klubowi</button>';
    html+='<button class="btn btn-sm" data-scout-dismiss="'+i+'">Odrzuć</button>';
    html+='</div></div>';
  });
  html+='</div>';
  var cost=S.scout2.level*200000;
  html+='<div class="center mt2"><button class="btn" id="newReports">Nowe raporty ('+money(cost)+')</button></div>';
  if(S.scout2.level<5) html+='<div class="center mt"><button class="btn" id="upgradeScout">Ulepsz skauting do poziomu '+(S.scout2.level+1)+' ('+money(S.scout2.level*500000)+')</button></div>';
  html+='<div class="center mt2"><button class="btn" id="backBtn">‹ Wróć</button></div></section>';
  setView(html);
  $('#backBtn').onclick=()=>{S.view='dashboard';render();};
  if($('#newReports')) $('#newReports').onclick=()=>{
    var c=S.scout2.level*200000;
    if(S.player.wealth<c){toast('Za mało środków!');return;}
    S.player.wealth-=c; S.scout2.reports=[]; S.scout2.scouted+=3;
    toast('Nowe raporty skautingowe!');
    save(); render();
  };
  if($('#upgradeScout')) $('#upgradeScout').onclick=()=>{
    var c=S.scout2.level*500000;
    if(S.player.wealth<c){toast('Za mało środków!');return;}
    S.player.wealth-=c; S.scout2.level++;
    toast('Skauting ulepszony do poziomu '+S.scout2.level+'!');
    save(); render({preserveScroll:true});
  };
  $$('[data-scout-rec]').forEach(b=>b.onclick=()=>{
    var idx=+b.dataset.scoutRec;
    var r=S.scout2.reports[idx];
    S.scout2.found.push(r); S.scout2.scouted++;
    S.player.reputation=clamp(S.player.reputation+2,0,100);
    S.brand.followers+=5000;
    toast('Rekomendowano '+r.name+' klubowi! +2 reputacji');
    S.scout2.reports.splice(idx,1);
    save(); render({preserveScroll:true});
  });
  $$('[data-scout-dismiss]').forEach(b=>b.onclick=()=>{
    var idx=+b.dataset.scoutDismiss;
    S.scout2.reports.splice(idx,1);
    save(); render({preserveScroll:true});
  });
}


/* ---------- Puchary europejskie ---------- */
function renderEuroCups(){
  ensureUefaCoefficients();
  var euro = S.world && S.world.europe;
  var html = '<section class="panel">';
  html += '<h2>Puchary europejskie</h2>';

  /* RANKING UEFA KRAJÓW */
  var ranking = getUefaRanking();
  html += '<div class="card mb" style="background:var(--color-surface-2);">';
  html += '<h3>📊 Ranking UEFA krajów</h3>';
  html += '<div class="sub mb">Współczynnik = suma punktów wszystkich klubów / liczba klubów (5-letnia średnia)</div>';
  html += '<div style="overflow-x:auto;"><table style="width:100%;font-size:0.85em;border-collapse:collapse;">';
  html += '<tr style="border-bottom:2px solid var(--color-primary);"><th style="text-align:left;padding:4px;">#</th><th style="text-align:left;padding:4px;">Kraj</th><th style="text-align:right;padding:4px;">Wsp.</th><th style="text-align:center;padding:4px;">UCL</th><th style="text-align:center;padding:4px;">UEL</th><th style="text-align:center;padding:4px;">UECL</th></tr>';
  ranking.forEach(function(r,i){
    var dummy = {country:r.country};
    var slots = euroSlotsFor(dummy);
    var isPlayerCountry = S.club && leagueByName(S.club.league) && leagueByName(S.club.league).country===r.country;
    html += '<tr style="border-bottom:1px solid rgba(255,255,255,0.05);'+(isPlayerCountry?'background:rgba(255,255,255,0.05)':'')+'">';
    html += '<td style="padding:3px 4px;">'+(i+1)+'</td>';
    html += '<td style="padding:3px 4px;">'+r.country+'</td>';
    html += '<td style="text-align:right;padding:3px 4px;font-weight:700;">'+r.coeff.toFixed(3)+'</td>';
    html += '<td style="text-align:center;padding:3px 4px;color:#ffd700;">'+(slots.ucl||'-')+'</td>';
    html += '<td style="text-align:center;padding:3px 4px;color:#3498db;">'+(slots.uel||'-')+'</td>';
    html += '<td style="text-align:center;padding:3px 4px;color:#27ae60;">'+(slots.uecl||'-')+'</td>';
    html += '</tr>';
  });
  html += '</table></div>';
  html += '</div>';

  if(!euro || !euro.ucl){
    html += '<div class="notice mt">Kwalifikacje zostaną obliczone po zakończeniu sezonu.</div>';
  } else {
    html += '<div class="sub mb">Sezon '+euro.season+'</div>';
    var comps = [
      {key:'ucl', name:'Liga Mistrzów', icon:'🏆', color:'var(--color-primary)'},
      {key:'uel', name:'Liga Europy', icon:'🥈', color:'#3498db'},
      {key:'uecl', name:'Liga Konferencji', icon:'🥉', color:'#27ae60'}
    ];
    comps.forEach(function(c){
      var list = euro[c.key] || [];
      if(!list.length) return;
      html += '<div class="card mb" style="border-color:'+c.color+';">';
      html += '<h3 style="color:'+c.color+'">'+c.icon+' '+c.name+' ('+list.length+' klubów)</h3>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:4px;">';
      list.forEach(function(q){
        var isPlayer = S.club && S.club.name===q.club;
        html += '<span class="chip" style="'+(isPlayer?'border-color:var(--accent);font-weight:700':'')+'">'+q.flag+' '+q.club+' <small>('+q.league+', '+q.pos+')</small></span>';
      });
      html += '</div></div>';
    });
    // Wynik gracza
    if(S.season && S.season.euroCupRun){
      var run = S.season.euroCupRun;
      html += '<div class="card mt" style="background:var(--color-surface-2);">';
      html += '<b>Twój występ w pucharach:</b> '+run.stage+' ('+run.points+' pkt)';
      html += '</div>';
    }
    // Współczynnik europejski klubu gracza
    var coeff = getClubEuroCoefficient(S.club ? S.club.name : '');
    if(coeff > 0){
      html += '<div class="card mt" style="background:var(--color-surface-2);">';
      html += '<b>Współczynnik europejski '+S.club.name+':</b> '+coeff.toFixed(3)+' pkt';
      html += '</div>';
    }
    // Współczynnik kraju gracza
    if(S.club){
      var lg = leagueByName(S.club.league);
      if(lg && isEuropeanLeague(lg)){
        var cc = getCountryCoeff(lg.country);
        var rankPos = ranking.findIndex(function(r){return r.country===lg.country;});
        html += '<div class="card mt" style="background:var(--color-surface-2);">';
        html += '<b>Współczynnik '+lg.country+':</b> '+cc.toFixed(3)+' pkt (pozycja #'+(rankPos+1)+' w rankingu UEFA)';
        html += '</div>';
      }
    }
  }
  html += '<div class="center mt2"><button class="btn" onclick="S.view=\'dashboard\';render();">← Wróć</button></div>';
  html += '</section>';
  setView(html);
}

/* ---------- Init ---------- */
function init(){
  const saved=Storage.load();
  S = normalizeState(saved || defaultState());
  if(saved){
    if(!S.flags) S.flags={eggs:new Set(),achievements:new Set()};
    if(!(S.flags.eggs instanceof Set)) S.flags.eggs=new Set(S.flags.eggs||[]);
    if(!(S.flags.achievements instanceof Set)) S.flags.achievements=new Set(S.flags.achievements||[]);
    if(!S.brand) S.brand={followers:1000,marketability:10,sponsorships:[]};
    if(!S.team) S.team={chemistry:60};
    if(!S.player.attributes || !Object.keys(S.player.attributes).length) S.player.attributes=generateAttributes(S.player.ovr,S.player.position);
    if(!S.contract && S.club) S.contract=generateContract(S.player.ovr, S.leagueTier, S.player.weeklyWage);
    if(!S.season) S.season=newSeasonState();
    if(!S.season.pos) S.season.pos=emptyPosTotals();
    if(!S.national.cleanSheets) S.national.cleanSheets=0;
    if(!S.view) S.view='dashboard';
  }
  paintTheme();
  render();
}
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('beforeunload', ()=>{ if(S) save(); });
</script>
